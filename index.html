
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1016">
<title>الكرة مع عبده</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}
:root{--bg:#0f1016;--card:#1b1d29;--gold:#ffd700;--border:#303242;--green:#00e6a0}
body{background:var(--bg);color:white;min-height:100vh;padding-bottom:80px}
button,input{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#171822;border-bottom:2px solid var(--gold);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:900;color:var(--gold);font-size:17px}
.owner-badge{background:linear-gradient(135deg,#ffe566,#ff9500);color:#111;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px 12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px;background:#171822}
.tab{border:0;background:#292b38;color:#ddd;padding:10px 14px;border-radius:20px;white-space:nowrap;font-size:12px}
.tab.active{background:var(--gold);color:#111}
.heading{color:var(--gold);font-weight:bold;margin-bottom:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{font-size:11px;color:#aaa}
.btn{border:1px solid #594b16;background:#292414;color:var(--gold);padding:9px 12px;border-radius:9px;font-weight:bold}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 11px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aaa;font-size:11px;margin-bottom:18px}
.comp{overflow-wrap:anywhere}
.status{background:#292b38;border-radius:20px;padding:5px 8px;white-space:nowrap}
.status.live{background:#421923;color:#ff7380}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px;align-items:center;text-align:center}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.crest{width:42px;height:42px;object-fit:contain}
.placeholder{width:42px;height:42px;display:grid;place-items:center;font-size:25px}
.team-name{font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.score{direction:ltr;white-space:nowrap;background:#101117;border:1px solid #393b48;color:var(--gold);border-radius:10px;padding:9px;font-size:19px;font-weight:900}
.time{text-align:center;color:#bbb;font-size:11px;margin-top:12px}
.note{background:#12151d;border-right:3px solid var(--green);padding:10px;margin-top:12px;border-radius:7px;font-size:11px;line-height:1.8}
.state{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:25px 14px;font-size:13px;line-height:2;overflow-wrap:anywhere}
.state button{display:block;margin:12px auto 0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#151620;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom))}
.nav{background:none;border:0;color:#888;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:55px}
.nav span:first-child{font-size:19px}
.nav.active{color:var(--gold)}
footer{text-align:center;color:#777;font-size:11px;line-height:1.8;margin:20px 4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:390px;background:linear-gradient(145deg,#242633,#14151d);border:1px solid #68561b;border-radius:22px;padding:25px 20px;text-align:center;box-shadow:0 15px 60px #0008}
.crown{font-size:48px;margin-bottom:10px}
.login-title{color:var(--gold);font-size:23px;font-weight:900;margin-bottom:10px}
.login-desc{color:#ccc;font-size:13px;line-height:1.9;margin-bottom:20px}
.login-input{width:100%;padding:14px;border:1px solid #44475a;background:#0f1016;color:white;border-radius:11px;outline:none;margin-bottom:12px;font-size:16px}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;border:0;background:linear-gradient(135deg,#ffe566,#ff9b00);color:#111;padding:14px;border-radius:11px;font-weight:900;font-size:15px}
.login-error{color:#ff8585;font-size:12px;margin:8px 0}
.profile{display:none;margin-bottom:16px}
.profile .card{border-color:#725d1b}
.profile-name{font-size:17px;font-weight:bold;color:var(--gold)}
.profile-desc{font-size:12px;color:#bbb;margin-top:8px;line-height:1.8}
.hidden{display:none!important}
@media(max-width:360px){.logo{font-size:14px}.owner-badge{font-size:10px}.score{font-size:16px}.crest,.placeholder{width:34px;height:34px}}
</style>
</head>
<body>

<header>
  <div class="logo">⚽ الكرة مع عبده</div>
  <div id="header-user" class="owner-badge">👤 زائر</div>
</header>

<div id="login-overlay" class="overlay">
  <form id="login-form" class="login-card">
    <div class="crown">👑</div>
    <div class="login-title">الكرة مع عبده</div>
    <p class="login-desc">أهلًا بك في تطبيق الكرة مع عبده.<br>اكتب اسمك للدخول إلى التطبيق.</p>
    <input id="username" class="login-input" maxlength="30" placeholder="اكتب اسمك هنا" autocomplete="nickname" required>
    <button class="login-btn" type="submit">دخول إلى التطبيق ←</button>
    <p id="login-error" class="login-error"></p>
  </form>
</div>

<nav class="tabs">
  <button class="tab active" data-filter="all">كل المباريات</button>
  <button class="tab" data-filter="live">🔴 مباشر</button>
  <button class="tab" data-filter="scheduled">القادمة</button>
  <button class="tab" data-filter="finished">المنتهية</button>
</nav>

<main>
  <section id="profile" class="profile">
    <div class="card">
      <div id="profile-name" class="profile-name"></div>
      <div id="profile-desc" class="profile-desc"></div>
      <button id="change-user" class="btn" style="margin-top:12px">تغيير الاسم / تسجيل الخروج</button>
    </div>
  </section>

  <div class="heading">⚽ المباريات والنتائج</div>
  <div class="toolbar">
    <span id="updated" class="muted">في انتظار الاتصال...</span>
    <button id="refresh" class="btn">↻ تحديث المباريات</button>
  </div>
  <section id="matches" aria-live="polite">
    <div class="state">⏳ جاري تحميل المباريات...</div>
  </section>
  <footer>يتم تحديث النتائج كل دقيقة. ظهور المباريات يعتمد على بيانات وصلاحيات مزود الخدمة.</footer>
</main>

<nav class="bottom">
  <button class="nav active" data-page="home"><span>🏠</span><span>الرئيسية</span></button>
  <button class="nav" data-page="standings"><span>📊</span><span>الترتيب</span></button>
  <button class="nav" data-page="favorites"><span>⭐</span><span>المفضلة</span></button>
  <button class="nav" data-page="settings"><span>⚙️</span><span>الإعدادات</span></button>
</nav>

<script>
"use strict";

/*
  واجهة المباريات تتصل بمسار السيرفر /api/matches.
  لا تضع مفتاح football-data.org في الواجهة العامة.
  تسجيل الدخول هنا واجهة اسم محلية، وليس نظام تحقق آمنًا للملكية.
*/

const API_ENDPOINT = "/api/matches";
const OWNER_NAMES = ["عبده", "abpo", "abdo"];
const box = document.getElementById("matches");
const refreshButton = document.getElementById("refresh");
const updated = document.getElementById("updated");

let matches = [];
let filter = "all";
let busy = false;
let username = "";
let isOwner = false;

let favorites = [];
try {
  const saved = JSON.parse(localStorage.getItem("abdoFootballFavorites") || "[]");
  favorites = Array.isArray(saved) ? saved : [];
} catch (_) {
  favorites = [];
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

/* قراءة رسالة الخطأ حتى لو أعاد السيرفر كائنًا متداخلًا */
function errorMessage(data, fallback) {
  if (typeof data === "string" && data.trim()) return data;

  if (data && typeof data === "object") {
    const candidates = [
      data.error, data.message, data.details,
      data.error?.message, data.message?.message
    ];

    for (const value of candidates) {
      if (typeof value === "string" && value.trim()) return value;
    }

    if (data.error && typeof data.error === "object") {
      try {
        return JSON.stringify(data.error);
      } catch (_) {}
    }
  }

  return fallback;
}

function showLogin() {
  document.getElementById("login-overlay").classList.remove("hidden");
  document.getElementById("username").value = username;
  document.getElementById("login-error").textContent = "";
}

function login(name) {
  const clean = name.trim().replace(/\s+/g, " ");
  if (!clean) {
    document.getElementById("login-error").textContent = "اكتب اسمك الأول.";
    return;
  }

  username = clean;
  isOwner = OWNER_NAMES.includes(clean.toLowerCase());

  localStorage.setItem("abdoFootballUsername", username);

  document.getElementById("header-user").textContent =
    isOwner ? "👑 " + username + " · المالك" : "👤 " + username;

  document.getElementById("profile-name").textContent =
    (isOwner ? "👑 " : "👤 ") + username;

  document.getElementById("profile-desc").textContent = isOwner
    ? "واجهة المالك مفعّلة في هذا المتصفح."
    : "أهلًا بك في الكرة مع عبده.";

  document.getElementById("profile").style.display = "block";
  document.getElementById("login-overlay").classList.add("hidden");
  loadMatches();
}

document.getElementById("login-form").addEventListener("submit", event => {
  event.preventDefault();
  login(document.getElementById("username").value);
});

document.getElementById("change-user").addEventListener("click", () => {
  localStorage.removeItem("abdoFootballUsername");
  username = "";
  isOwner = false;
  document.getElementById("profile").style.display = "none";
  document.getElementById("header-user").textContent = "👤 زائر";
  showLogin();
});

function live(m) {
  return ["IN_PLAY", "PAUSED", "LIVE"].includes(m.status);
}

function statusName(m) {
  const map = {
    IN_PLAY:"مباشر", LIVE:"مباشر", PAUSED:"استراحة",
    FINISHED:"انتهت", AWARDED:"نتيجة معتمدة",
    SCHEDULED:"لم تبدأ", TIMED:"لم تبدأ",
    POSTPONED:"مؤجلة", SUSPENDED:"متوقفة", CANCELLED:"أُلغيت"
  };
  return map[m.status] || m.status || "غير معروف";
}

function scoreText(m) {
  const s = m.score || {};
  let h = s.fullTime?.home, a = s.fullTime?.away;

  if (h == null || a == null) {
    h = s.regularTime?.home ?? s.halfTime?.home;
    a = s.regularTime?.away ?? s.halfTime?.away;
  }

  return h == null || a == null ? "— : —" : `${h} : ${a}`;
}

function matchTime(m) {
  if (live(m) && m.minute != null) return "دقيقة المباراة: " + m.minute;
  if (m.status === "FINISHED") return "انتهت المباراة";
  if (!m.utcDate) return "الموعد غير متاح";

  const date = new Date(m.utcDate);
  if (Number.isNaN(date.getTime())) return "الموعد غير متاح";

  return new Intl.DateTimeFormat("ar-EG", {
    day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"
  }).format(date);
}

function teamHTML(team, fallback) {
  const name = team?.name || fallback;
  const crest = team?.crest;
  let logo = '<div class="placeholder">⚽</div>';

  if (crest && /^https?:\/\//i.test(crest)) {
    logo = `<img class="crest" src="${esc(crest)}" alt="" loading="lazy"
      referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
  }

  return `<div class="team">${logo}<span class="team-name">${esc(name)}</span></div>`;
}

function visibleMatches() {
  let list = [...matches];

  if (filter === "live") list = list.filter(live);
  if (filter === "scheduled") {
    list = list.filter(m => ["SCHEDULED","TIMED","POSTPONED","SUSPENDED"].includes(m.status));
  }
  if (filter === "finished") {
    list = list.filter(m => ["FINISHED","AWARDED"].includes(m.status));
  }
  if (filter === "favorites") {
    list = list.filter(m => favorites.includes(m.id));
  }

  return list.sort((a,b) => {
    if (live(a) !== live(b)) return live(a) ? -1 : 1;
    return new Date(a.utcDate || 0) - new Date(b.utcDate || 0);
  });
}

function renderMatches() {
  const list = visibleMatches();

  if (!list.length) {
    box.innerHTML = `<div class="state">
      ${matches.length
        ? "لا توجد مباريات في هذا التصنيف حاليًا."
        : "السيرفر لم يُرجع مباريات متاحة حاليًا."}
      <button id="retry" class="btn">إعادة المحاولة</button>
    </div>`;
    document.getElementById("retry").onclick = () => loadMatches();
    return;
  }

  box.innerHTML = list.map(m => {
    const isLive = live(m);
    const favorite = favorites.includes(m.id);
    return `<article class="card">
      <div class="meta">
        <span class="comp">🏆 ${esc(m.competition?.name || "بطولة كرة قدم")}</span>
        <span class="status ${isLive ? "live" : ""}">${isLive ? "🔴 " : ""}${esc(statusName(m))}</span>
      </div>
      <div class="teams">
        ${teamHTML(m.homeTeam, "الفريق الأول")}
        <div class="score">${esc(scoreText(m))}</div>
        ${teamHTML(m.awayTeam, "الفريق الثاني")}
      </div>
      <div class="time">${esc(matchTime(m))}</div>
      <div class="note">
        ${isLive ? "🔴 المباراة جارية وفق بيانات الخدمة." :
          m.status === "FINISHED" ? "✅ انتهت المباراة." : "📅 تابع موعد المباراة وحالتها."}
        <br>
        <button class="btn favorite-btn" data-id="${Number(m.id)}">
          ${favorite ? "★ إزالة من المفضلة" : "☆ أضف للمفضلة"}
        </button>
      </div>
    </article>`;
  }).join("");

  box.querySelectorAll(".favorite-btn").forEach(button => {
    button.addEventListener("click", () => {
      const id = Number(button.dataset.id);
      favorites = favorites.includes(id)
        ? favorites.filter(item => item !== id)
        : [...favorites, id];

      localStorage.setItem("abdoFootballFavorites", JSON.stringify(favorites));
      renderMatches();
    });
  });
}

function showError(message) {
  box.innerHTML = `<div class="state">
    <div style="font-size:28px">⚠️</div>
    <div>${esc(message)}</div>
    <button id="retry" class="btn">إعادة المحاولة</button>
  </div>`;
  document.getElementById("retry").onclick = () => loadMatches();
}

async function loadMatches() {
  if (busy) return;
  busy = true;
  refreshButton.disabled = true;
  refreshButton.textContent = "⏳ جاري التحميل";

  if (!matches.length) {
    box.innerHTML = '<div class="state">⏳ جاري الاتصال بالسيرفر...</div>';
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(API_ENDPOINT, {
      headers: { Accept:"application/json" },
      cache:"no-store",
      signal:controller.signal
    });

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch (_) {
      throw new Error(response.status === 404
        ? "المسار /api/matches غير موجود على الاستضافة. يلزم نشر Backend."
        : "السيرفر لم يُرجع JSON صالحًا. تحقق من إعدادات API.");
    }

    if (!response.ok || data.ok === false) {
      throw new Error(errorMessage(data, "تعذر جلب المباريات. رمز الخطأ: " + response.status));
    }

    if (!Array.isArray(data.matches)) {
      throw new Error("استجابة السيرفر لا تحتوي على قائمة matches صحيحة.");
    }

    matches = data.matches;
    renderMatches();

    updated.textContent = "آخر تحديث: " + new Intl.DateTimeFormat("ar-EG", {
      hour:"2-digit", minute:"2-digit", second:"2-digit"
    }).format(new Date());

  } catch (error) {
    console.error("Matches error:", error);
    showError(error.name === "AbortError"
      ? "انتهت مهلة الاتصال بالسيرفر. حاول مرة أخرى."
      : error.message || "تعذر الاتصال بالسيرفر.");
  } finally {
    clearTimeout(timeout);
    busy = false;
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ تحديث المباريات";
  }
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    filter = button.dataset.filter;
    renderMatches();
  });
});

refreshButton.addEventListener("click", loadMatches);

document.querySelectorAll(".nav").forEach(button => {
  button.addEventListener("click", () => {
    const page = button.dataset.page;
    document.querySelectorAll(".nav").forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    if (page === "home") {
      filter = "all";
      document.querySelectorAll(".tab").forEach(b =>
        b.classList.toggle("active", b.dataset.filter === "all")
      );
      renderMatches();
    } else if (page === "favorites") {
      filter = "favorites";
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      renderMatches();
    } else if (page === "standings") {
      showError("قسم الترتيب يحتاج إلى اختيار بطولة وربطه بمسار بيانات الترتيب على السيرفر.");
    } else {
      showError("يمكنك تغيير اسم الدخول من بطاقة الملف الشخصي أعلى الصفحة.");
    }
  });
});

const savedName = localStorage.getItem("abdoFootballUsername");
if (savedName) {
  login(savedName);
} else {
  showLogin();
}

setInterval(() => {
  if (!document.hidden && username) loadMatches();
}, 60000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && username && !busy) loadMatches();
});
</script>
</body>
</html>
