<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Tube - عبده تيوپ</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-red: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo span.yt-red {
            background: var(--accent-red);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
            max-width: 220px;
            margin: 0 8px;
        }

        .search-container input {
            width: 100%;
            padding: 6px 12px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .mic-btn {
            background: #222;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mic-btn.listening {
            background: var(--accent-red);
        }

        /* Layout Main */
        .container {
            padding: 10px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Feed Videos */
        .video-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .feed-card {
            background: #0f0f0f;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .feed-info {
            padding: 10px 5px;
            display: flex;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            color: #fff;
        }

        .feed-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .feed-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
        }

        .feed-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Shorts Feed */
        .shorts-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .short-card {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 520px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .short-card iframe, .short-card video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        .short-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }

        .sub-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Profile Style */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 5px;
            border-bottom: 1px solid #222;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .profile-stats {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .my-videos-title {
            margin: 15px 0 10px 0;
            font-size: 16px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item .icon {
            font-size: 18px;
        }

        .plus-btn {
            font-size: 28px;
            line-height: 1;
            color: #fff;
        }

        /* Upload Form */
        .upload-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-box input, .upload-box select, .upload-box button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #272727;
            color: #fff;
        }

        .upload-box button {
            background: var(--accent-red);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="yt-red">▶</span> AbdoTube
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="بحث..." oninput="handleSearch()">
            <button class="mic-btn" id="micBtn" onclick="startVoiceSearch()">🎙️</button>
        </div>
        <div id="userBadge" style="font-size: 12px; font-weight: bold;">عماد</div>
    </header>

    <div class="container">
        <!-- الصفحة الرئيسية -->
        <div id="home" class="section active">
            <div class="video-feed" id="videoFeed"></div>
        </div>

        <!-- Shorts -->
        <div id="shorts" class="section">
            <div class="shorts-grid" id="shortsGrid"></div>
        </div>

        <!-- رفع فيديو (زر +) -->
        <div id="upload" class="section">
            <div class="upload-box">
                <h3>إنشاء ونشر فيديو 📤</h3>
                <input type="text" id="uploadTitle" placeholder="عنوان الفيديو">
                <select id="uploadType">
                    <option value="video">فيديو عادي</option>
                    <option value="short">فيديو قصير (Shorts)</option>
                </select>
                <input type="file" id="uploadFile" accept="video/*">
                <button onclick="uploadVideo()">نشر الآن</button>
            </div>
        </div>

        <!-- الاشتراكات -->
        <div id="subs" class="section">
            <h3 style="text-align: center; margin-top: 30px;">القنوات المشترك فيها 👍</h3>
            <p style="text-align: center; color: var(--text-secondary); margin-top: 10px;">لا يوجد اشتراكات جديدة حالياً</p>
        </div>

        <!-- حسابك (صفحة قناتك) -->
        <div id="profile" class="section">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">ع</div>
                <div>
                    <h2 id="profileName">عماد</h2>
                    <div class="profile-stats">
                        <span>المشتركين: <b id="subCount">1.2k</b></span>
                        <span>الفيديوهات: <b id="videoCount">0</b></span>
                    </div>
                </div>
            </div>

            <h3 class="my-videos-title">فيديوهاتك المرفوعة 🎬</h3>
            <div class="video-feed" id="myVideosFeed"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchTab('shorts', this)">
            <span class="icon">⚡</span>
            <span>Shorts</span>
        </button>
        <button class="nav-item" onclick="switchTab('upload', this)">
            <span class="icon plus-btn">+</span>
        </button>
        <button class="nav-item" onclick="switchTab('subs', this)">
            <span class="icon">🔔</span>
            <span>الاشتراكات</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span class="icon">👤</span>
            <span>أنت</span>
        </button>
    </div>

    <script>
        let currentUser = localStorage.getItem('abdo_user') || 'عماد';

        // قائمة الفيديوهات العامة
        let videos = [
            {
                id: '1',
                title: 'لما يحصل حاجات غريبه متتوقعهاش من ابوك وامك - الجزء الثالث',
                author: 'Bassem Otaka',
                views: '8.6M',
                embedUrl: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0',
                type: 'video'
            },
            {
                id: '2',
                title: 'هل اقدر احقق الكرة الذهبية بلاعب معتزل؟',
                author: 'Syrian Gamer - سوري جيمر',
                views: '1.2M',
                embedUrl: 'https://www.youtube-nocookie.com/embed/3JZ_D3ELwOQ?rel=0',
                type: 'video'
            }
        ];

        let shorts = [
            {
                id: 's1',
                title: 'تحدي وسرعة ⚡',
                author: 'عماد',
                embedUrl: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0',
                likes: '250K'
            }
        ];

        let myUploadedVideos = [];

        function init() {
            document.getElementById('userBadge').innerText = currentUser;
            document.getElementById('profileName').innerText = currentUser;
            document.getElementById('profileAvatar').innerText = currentUser[0] || 'ع';
            renderHomeFeed(videos);
            renderShortsFeed(shorts);
            renderMyVideos();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        // 1. تشغيل خاصية البحث الحقيقي
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filteredVideos = videos.filter(v => v.title.toLowerCase().includes(query) || v.author.toLowerCase().includes(query));
            renderHomeFeed(filteredVideos);
        }

        function renderHomeFeed(list) {
            const feed = document.getElementById('videoFeed');
            feed.innerHTML = '';
            if(list.length === 0) {
                feed.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">لا توجد نتائج بحث مطابقة</p>';
                return;
            }
            list.forEach(v => {
                feed.innerHTML += `
                    <div class="feed-card">
                        <div class="video-wrapper">
                            ${v.src ? `<video src="${v.src}" controls></video>` : `<iframe src="${v.embedUrl}" allowfullscreen></iframe>`}
                        </div>
                        <div class="feed-info">
                            <div class="channel-avatar">${v.author[0]}</div>
                            <div class="feed-details">
                                <div class="feed-title">${v.title}</div>
                                <div class="feed-meta">${v.author} • ${v.views} مشاهدة</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderShortsFeed(list) {
            const grid = document.getElementById('shortsGrid');
            grid.innerHTML = '';
            list.forEach(s => {
                grid.innerHTML += `
                    <div class="short-card">
                        ${s.src ? `<video src="${s.src}" controls loop></video>` : `<iframe src="${s.embedUrl}" allowfullscreen></iframe>`}
                        <div class="short-overlay">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span>@${s.author}</span>
                                <button class="sub-btn" onclick="toggleSub(this)">اشتراك</button>
                            </div>
                            <p style="margin-top:5px; font-size:13px;">${s.title}</p>
                        </div>
                    </div>
                `;
            });
        }

        // 3. عرض فيديوهات القناة الخاصة بك فقط
        function renderMyVideos() {
            const myFeed = document.getElementById('myVideosFeed');
            myFeed.innerHTML = '';
            document.getElementById('videoCount').innerText = myUploadedVideos.length;

            if(myUploadedVideos.length === 0) {
                myFeed.innerHTML = '<p style="color:#aaa; font-size:13px;">لم تقم بنشر أي فيديوهات بعد.</p>';
                return;
            }

            myUploadedVideos.forEach(v => {
                myFeed.innerHTML += `
                    <div class="feed-card">
                        <div class="video-wrapper">
                            <video src="${v.src}" controls></video>
                        </div>
                        <div class="feed-info">
                            <div class="feed-details">
                                <div class="feed-title">${v.title}</div>
                                <div class="feed-meta">قناتك • ${v.views} مشاهدة</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSub(btn) {
            if(btn.innerText === 'اشتراك') {
                btn.innerText = 'تم الاشتراك';
                btn.style.background = '#333';
            } else {
                btn.innerText = 'اشتراك';
                btn.style.background = 'var(--accent-red)';
            }
        }

        function uploadVideo() {
            const title = document.getElementById('uploadTitle').value;
            const type = document.getElementById('uploadType').value;
            const fileInput = document.getElementById('uploadFile');

            if(!title || !fileInput.files[0]) {
                alert('يرجى اختيار فيديو وكتابة العنوان أولاً');
                return;
            }

            const url = URL.createObjectURL(fileInput.files[0]);
            const newVid = {
                id: Date.now().toString(),
                title: title,
                author: currentUser,
                views: '1',
                src: url,
                type: type
            };

            myUploadedVideos.unshift(newVid);

            if(type === 'video') {
                videos.unshift(newVid);
                renderHomeFeed(videos);
                switchTab('home');
            } else {
                shorts.unshift(newVid);
                renderShortsFeed(shorts);
                switchTab('shorts');
            }

            renderMyVideos();
            alert('تم نشر الفيديو على قناتك بنجاح!');
        }

        function startVoiceSearch() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('البحث الصوتي غير مدعوم على هذا المتصفح');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';

            recognition.onstart = () => micBtn.classList.add('listening');
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('searchInput').value = text;
                handleSearch();
                micBtn.classList.remove('listening');
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
            recognition.start();
        }

        window.onload = init;
    </script>
</body>
    </html>
