<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عبده يوتيوب 2 - AbdoTube II</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f1f1f1;
      --muted: #aaa;
      --border: #222;
      --pink: #ff0033;
      --gold: #ffd700;
      --card: #1f1f1f;
      --hover: #303030;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Roboto, Arial, Tahoma, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    /* شاشة تسجيل الدخول والملكية */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 16px;
      width: min(400px, 100%);
      text-align: center;
    }
    .login-logo { font-size: 26px; font-weight: bold; margin-bottom: 20px; color: #fff; }
    .login-logo span { color: var(--pink); }
    .login-input {
      width: 100%;
      padding: 12px 16px;
      background: #121212;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
      text-align: right;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--pink);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }

    /* الهيدر مطابق ليوتيوب الأصلي */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .logo-area { display: flex; align-items: center; gap: 15px; }
    .logo {
      background: none; border: 0; color: #fff;
      font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer;
    }
    .logo b { color: var(--pink); }
    
    .search-area {
      display: flex; flex: 1; max-width: 600px; margin: 0 20px;
    }
    .search-input {
      width: 100%; padding: 8px 16px; background: #121212; border: 1px solid var(--border);
      color: #fff; border-radius: 40px 0 0 40px; outline: none; font-size: 15px;
    }
    .search-btn {
      background: #222; border: 1px solid var(--border); border-right: 0;
      padding: 0 20px; border-radius: 0 40px 40px 0; color: #fff; font-size: 16px;
    }

    .user-profile-badge {
      display: flex; align-items: center; gap: 8px; background: #222;
      padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;
    }
    .verified-badge { color: #3ea6ff; font-size: 14px; }
    .king-crown { color: var(--gold); }

    /* التخطيط العام */
    .layout { display: flex; }
    aside {
      width: 240px; height: calc(100vh - 56px); position: sticky; top: 56px;
      padding: 12px; background: var(--bg); overflow-y: auto; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; gap: 20px; padding: 10px 12px;
      border-radius: 10px; background: transparent; border: 0; color: #fff;
      width: 100%; text-align: right; font-size: 14px; margin-bottom: 4px;
    }
    .nav-item:hover, .nav-item.active { background: var(--hover); }

    main { flex: 1; padding: 24px; min-width: 0; }
    
    /* الفيديوهات والشبكة */
    .chips { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; scrollbar-width: none; }
    .chip {
      background: #272727; border: 0; color: #fff; padding: 6px 14px;
      border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: #f1f1f1; color: #0f0f0f; font-weight: bold; }

    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px 16px;
    }
    .video-card { cursor: pointer; }
    .thumbnail {
      aspect-ratio: 16/9; background: #222; border-radius: 12px; overflow: hidden; position: relative;
    }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .video-details { display: flex; gap: 12px; margin-top: 10px; }
    .channel-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--pink);
      color: #fff; display: grid; place-items: center; font-weight: bold; flex-shrink: 0;
    }
    .video-title { font-size: 15px; font-weight: 500; line-height: 1.4; color: #fff; margin-bottom: 4px; }
    .video-meta { font-size: 13px; color: var(--muted); }

    /* مشاهدة الفيديو (Modal) */
    .modal {
      position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--card); border-radius: 16px; width: min(900px, 100%);
      padding: 20px; border: 1px solid var(--border);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-modal { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; }
    .player-container { aspect-ratio: 16/9; width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
    .player-container iframe { width: 100%; height: 100%; border: 0; }

    .status-msg { text-align: center; padding: 40px; color: var(--muted); font-size: 16px; grid-column: 1/-1; }

    @media(max-width: 768px) {
      aside { display: none; }
      .search-area { margin: 0 10px; }
    }
  </style>
</head>
<body>

<!-- شاشة تسجيل الدخول والتعرف على المالك -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">▶ عبده <span>يوتيوب 2</span></div>
    <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">أدخل اسمك للدخول إلى المنصة (اكتب "عبده" للحصول على صلاحيات المالك الملكي 👑):</p>
    <form id="login-form">
      <input type="text" id="username-input" class="login-input" placeholder="اكتب اسمك هنا..." required autocomplete="off">
      <button type="submit" class="login-btn">دخول المنصة</button>
    </form>
  </div>
</div>

<!-- الهيدر الرئيسي -->
<header>
  <div class="logo-area">
    <button class="logo" onclick="switchPage('home')">▶ عبده <b>يوتيوب 2</b></button>
  </div>
  <form class="search-area" id="search-form">
    <input type="text" id="search-input" class="search-input" placeholder="بحث..." autocomplete="off">
    <button type="submit" class="search-btn">🔍</button>
  </form>
  <div class="user-profile-badge" id="user-badge-display">
    <!-- يتم تعبئتها ديناميكياً -->
  </div>
</header>

<div class="layout">
  <!-- القائمة الجانبية المنسدلة مطابقة ليوتيوب -->
  <aside>
    <button class="nav-item active" onclick="switchPage('home')">🏠 الرئيسية</button>
    <button class="nav-item" onclick="switchPage('shorts')">⚡ الشورتس</button>
    <button class="nav-item" onclick="switchPage('subscriptions')">📺 الاشتراكات</button>
    <button class="nav-item" onclick="switchPage('channel')">👤 قناتي والملكية</button>
  </aside>

  <main>
    <!-- الأقسام والتصنيفات -->
    <div class="chips" id="chips-container">
      <button class="chip active" onclick="filterCategory('الكل', this)">الكل</button>
      <button class="chip" onclick="filterCategory('ألعاب فيديو', this)">ألعاب فيديو</button>
      <button class="chip" onclick="filterCategory('كرة القدم', this)">كرة القدم</button>
      <button class="chip" onclick="filterCategory('موسيقى عربية', this)">موسيقى</button>
      <button class="chip" onclick="filterCategory('تقنية وموبايلات', this)">تقنية</button>
      <button class="chip" onclick="filterCategory('ضحك وكوميديا', this)">كوميديا</button>
    </div>

    <h2 id="section-title" style="font-size: 18px; margin-bottom: 16px; font-weight: 500;">الفيديوهات المقترحة</h2>
    <div id="video-grid" class="video-grid">
      <div class="status-msg">جاري تحميل الفيديوهات من يوتيوب...</div>
    </div>
  </main>
</div>

<!-- مشغل الفيديو المنبثق -->
<div class="modal" id="video-modal" onclick="closeModalOnBackdrop(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-video-title" style="margin: 0; font-size: 16px;">عنوان الفيديو</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="player-container">
      <iframe id="youtube-iframe" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
"use strict";

const API_KEY = "AIzaSyAhXKfQspu2iCtM4QZ83U-siTnBvFIAEyw";
const $ = id => document.getElementById(id);

let currentUser = "";
let isOwner = false;

// التحقق من اسم المستخدم عند بدء التشغيل
window.addEventListener("DOMContentLoaded", () => {
  const savedUser = localStorage.getItem("abdotube2_user");
  if (savedUser) {
    setupUser(savedUser);
  }
});

$("login-form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("username-input").value.trim();
  if (name) {
    localStorage.setItem("abdotube2_user", name);
    setupUser(name);
  }
});

function setupUser(name) {
  currentUser = name;
  const lower = name.toLowerCase();
  // التحقق من اسم المالك للحصول على الحصانة والتاج والتوثيق
  isOwner = (lower === "عبده" || lower === "abdo" || lower === "abpo");

  let badgeHTML = `<span>${escapeHTML(currentUser)}</span>`;
  if (isOwner) {
    badgeHTML = `<span class="king-crown">👑</span> <span>${escapeHTML(currentUser)}</span> <span class="verified-badge" title="حساب موثق للمالك الرسمي">✓</span>`;
  }
  $("user-badge-display").innerHTML = badgeHTML;
  $("login-screen").style.display = "none";

  // جلب الفيديوهات الافتراضية للرئيسية
  fetchYouTubeVideos("فيديوهات عربية روعة");
}

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

// الاتصال بـ YouTube API وجلب النتائج الحقيقية
async function fetchYouTubeVideos(query) {
  const grid = $("video-grid");
  grid.innerHTML = `<div class="status-msg">جاري تحميل أحدث فيديوهات يوتيوب...</div>`;

  try {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&regionCode=EG&relevanceLanguage=ar&key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.items && data.items.length > 0) {
      grid.innerHTML = "";
      data.items.forEach(item => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channelTitle = item.snippet.channelTitle;
        const thumb = item.snippet.thumbnails.high.url;

        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="thumbnail">
            <img src="${thumb}" alt="${escapeHTML(title)}" loading="lazy">
          </div>
          <div class="video-details">
            <div class="channel-avatar">${escapeHTML(channelTitle.charAt(0))}</div>
            <div>
              <div class="video-title">${escapeHTML(title)}</div>
              <div class="video-meta">${escapeHTML(channelTitle)}</div>
            </div>
          </div>
        `;
        card.addEventListener("click", () => openPlayer(videoId, title));
        grid.appendChild(card);
      });
    } else {
      grid.innerHTML = `<div class="status-msg">لا توجد نتائج مطابقة، جرب بحثاً آخر.</div>`;
    }
  } catch (err) {
    grid.innerHTML = `<div class="status-msg" style="color: #ff4444;">حدث خطأ أثناء الاتصال بخوادم يوتيوب. تأكد من الإنترنت.</div>`;
  }
}

// البحث اليدوي
$("search-form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("search-input").value.trim();
  if (q) {
    $("section-title").textContent = `نتائج البحث عن: ${q}`;
    fetchYouTubeVideos(q);
  }
});

// التصنيفات السريعة
function filterCategory(category, btn) {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  $("section-title").textContent = category === "الكل" ? "الفيديوهات المقترحة" : `محتوى: ${category}`;
  fetchYouTubeVideos(category === "الكل" ? "فيديوهات عربية مشهورة" : category);
}

// فتح مشغل الفيديو المنبثق
function openPlayer(videoId, title) {
  $("modal-video-title").textContent = title;
  $("youtube-iframe").src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
  $("video-modal").classList.add("open");
}

function closeModal() {
  $("video-modal").classList.remove("open");
  $("youtube-iframe").src = "";
}

function closeModalOnBackdrop(e) {
  if (e.target === $("video-modal")) {
    closeModal();
  }
}

// التنقل بين الصفحات في القائمة الجانبية
function switchPage(page) {
  document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
  event?.currentTarget?.classList.add("active");

  const grid = $("video-grid");
  if (page === "home") {
    $("section-title").textContent = "الفيديوهات المقترحة";
    fetchYouTubeVideos("فيديوهات عربية متنوعة");
  } else if (page === "shorts") {
    $("section-title").textContent = "الفيديوهات القصيرة (Shorts)";
    fetchYouTubeVideos("أحدث الشورتس المصرية والعربية");
  } else if (page === "subscriptions") {
    $("section-title").textContent = "القنوات المشترك بها";
    fetchYouTubeVideos("أفضل القنوات العربية");
  } else if (page === "channel") {
    $("section-title").textContent = "قناتي الملكية وخيارات التطبيق";
    grid.innerHTML = `
      <div style="grid-column: 1/-1; background: var(--card); padding: 30px; border-radius: 12px; text-align: center; border: 1px solid var(--border);">
        <h2 style="color: var(--pink);">قناة المالك الرسمي: ${escapeHTML(currentUser)} ${isOwner ? '👑 ✓' : ''}</h2>
        <p style="color: var(--muted);">أنت تملك الصلاحيات الكاملة على منصة "عبده يوتيوب 2".</p>
        <button onclick="localStorage.removeItem('abdotube2_user'); location.reload();" style="background: #333; color: #fff; border: 0; padding: 10px 20px; border-radius: 8px; margin-top: 15px; cursor: pointer;">تبديل الحساب / تسجيل الخروج</button>
      </div>
    `;
  }
}
</script>
</body>
</html>
