
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1016">
<title>الكرة مع عبده - التطبيق المباشر</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}
:root{--bg:#0f1016;--card:#1a1c28;--gold:#ffd700;--border:#2a2d3d;--green:#00e6a0}
body{background:var(--bg);color:#fff;padding-bottom:80px;min-height:100vh}
header{background:linear-gradient(135deg,#242532,#111218);padding:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:10}
.logo{font-size:17px;font-weight:900;color:var(--gold)}
.owner{background:linear-gradient(135deg,#ffd700,#ff9200);color:#000;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:900;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#161822;border-bottom:1px solid var(--border)}
.tab{border:0;border-radius:20px;background:#292b38;color:#ddd;padding:10px 14px;white-space:nowrap;font-size:12px;font-weight:bold}
.tab.active{background:var(--gold);color:#111}
main{max-width:650px;margin:auto;padding:15px 12px}
.heading{font-size:15px;font-weight:bold;color:var(--gold);margin-bottom:15px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{font-size:11px;color:#aaa}
button{cursor:pointer}
.refresh{padding:9px 12px;background:#292414;color:var(--gold);border:1px solid #51461c;border-radius:9px;font-weight:bold}
.refresh:disabled{opacity:.5}
.card{background:linear-gradient(145deg,#1e202d,#171923);border:1px solid var(--border);border-radius:15px;padding:14px 11px;margin-bottom:13px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aaa;font-size:11px;margin-bottom:18px}
.comp{overflow-wrap:anywhere}
.status{background:#292b38;padding:5px 8px;border-radius:20px;white-space:nowrap}
.status.live{background:#3b171e;color:#ff6474}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:7px;text-align:center}
.team{min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px}
.crest{width:42px;height:42px;object-fit:contain}
.placeholder{width:42px;height:42px;display:grid;place-items:center;font-size:25px}
.team-name{font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.score{direction:ltr;white-space:nowrap;background:#101117;border:1px solid #393b48;color:var(--gold);border-radius:10px;padding:9px 10px;font-size:20px;font-weight:900}
.time{text-align:center;color:#bbb;font-size:11px;margin-top:12px}
.note{background:#12151d;border-right:3px solid var(--green);border-radius:7px;padding:10px;margin-top:12px;font-size:11px;line-height:1.8;color:#ddd}
.state{text-align:center;padding:27px 15px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:#ddd;font-size:13px;line-height:2;overflow-wrap:anywhere}
.state button{display:block;margin:12px auto 0;background:var(--gold);border:0;border-radius:8px;padding:9px 14px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#12131b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:11px 4px calc(11px + env(safe-area-inset-bottom));z-index:10}
.nav{background:none;border:0;color:#888;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:55px}
.nav span:first-child{font-size:19px}
.nav.active{color:var(--gold)}
footer{text-align:center;color:#777;font-size:11px;line-height:1.8;margin:20px 5px}
@media(max-width:360px){.logo{font-size:14px}.owner{font-size:10px}.score{font-size:17px;padding:8px}.crest,.placeholder{width:35px;height:35px}}
</style>
</head>

<body>
<header>
  <div class="logo">⚽ الكرة مع عبده</div>
  <div class="owner">👑 Abpo · المالك</div>
</header>

<nav class="tabs">
  <button class="tab active" data-filter="all">كل المباريات</button>
  <button class="tab" data-filter="live">🔴 مباشر</button>
  <button class="tab" data-filter="scheduled">القادمة</button>
  <button class="tab" data-filter="finished">المنتهية</button>
</nav>

<main>
  <div class="heading">⚽ المباريات والنتائج</div>

  <div class="toolbar">
    <span class="muted" id="updated">جاري الاتصال بالسيرفر...</span>
    <button class="refresh" id="refresh">↻ تحديث المباريات</button>
  </div>

  <section id="matches" aria-live="polite">
    <div class="state">⏳ جاري تحميل المباريات...</div>
  </section>

  <footer>
    يتم تحديث البيانات كل 60 ثانية.
    النتائج المعروضة تعتمد على بيانات مزود الخدمة.
  </footer>
</main>

<nav class="bottom">
  <button class="nav active" data-page="home"><span>🏠</span><span>الرئيسية</span></button>
  <button class="nav" data-page="standings"><span>📊</span><span>الترتيب</span></button>
  <button class="nav" data-page="favorites"><span>⭐</span><span>المفضلة</span></button>
  <button class="nav" data-page="settings"><span>⚙️</span><span>الإعدادات</span></button>
</nav>

<script>
"use strict";

/*
  الواجهة تتصل بالسيرفر عبر /api/matches.
  يجب تشغيل Backend على نفس الموقع أو إعداد مسار API صحيح.
  لا تضع مفتاح API السري في هذا الملف.
*/

const API_ENDPOINT = "/api/matches";
const REFRESH_INTERVAL = 60000;

const box = document.getElementById("matches");
const refreshButton = document.getElementById("refresh");
const updated = document.getElementById("updated");

let matches = [];
let filter = "all";
let busy = false;
let controller = null;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function isLive(match) {
  return ["IN_PLAY","PAUSED","LIVE"].includes(match.status);
}

function statusName(match) {
  const names = {
    IN_PLAY:"مباشر",
    LIVE:"مباشر",
    PAUSED:"استراحة",
    FINISHED:"انتهت",
    AWARDED:"نتيجة معتمدة",
    SCHEDULED:"لم تبدأ",
    TIMED:"لم تبدأ",
    POSTPONED:"مؤجلة",
    SUSPENDED:"متوقفة",
    CANCELLED:"أُلغيت"
  };
  return names[match.status] || "غير معروف";
}

function getScore(match) {
  const score = match.score || {};
  let home = score.fullTime?.home;
  let away = score.fullTime?.away;

  if (home == null || away == null) {
    home = score.regularTime?.home ?? score.halfTime?.home;
    away = score.regularTime?.away ?? score.halfTime?.away;
  }

  return home == null || away == null ? "— : —" : `${home} : ${away}`;
}

function getTime(match) {
  if (isLive(match) && match.minute != null) {
    return `دقيقة المباراة: ${match.minute}`;
  }

  if (match.status === "FINISHED") {
    return "انتهت المباراة";
  }

  if (!match.utcDate) return "الموعد غير متاح";

  const date = new Date(match.utcDate);
  if (Number.isNaN(date.getTime())) return "الموعد غير متاح";

  return new Intl.DateTimeFormat("ar-EG", {
    day:"numeric",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  }).format(date);
}

function teamHTML(team, fallback) {
  const name = team?.name || fallback;
  const crest = team?.crest;
  let logo = '<div class="placeholder">⚽</div>';

  if (crest && /^https?:\/\//i.test(crest)) {
    logo = `<img class="crest" src="${escapeHTML(crest)}"
      alt="" loading="lazy" referrerpolicy="no-referrer"
      onerror="this.style.display='none'">`;
  }

  return `<div class="team">
    ${logo}
    <span class="team-name">${escapeHTML(name)}</span>
  </div>`;
}

function filteredMatches() {
  let list = [...matches];

  if (filter === "live") {
    list = list.filter(isLive);
  } else if (filter === "scheduled") {
    list = list.filter(m =>
      ["SCHEDULED","TIMED","POSTPONED","SUSPENDED"].includes(m.status)
    );
  } else if (filter === "finished") {
    list = list.filter(m =>
      ["FINISHED","AWARDED"].includes(m.status)
    );
  }

  return list.sort((a,b) => {
    if (isLive(a) !== isLive(b)) return isLive(a) ? -1 : 1;
    return new Date(a.utcDate || 0) - new Date(b.utcDate || 0);
  });
}

function renderMatches() {
  const list = filteredMatches();

  if (!list.length) {
    box.innerHTML = `<div class="state">
      ${matches.length
        ? "لا توجد مباريات في هذا التصنيف حاليًا."
        : "لم يرجع السيرفر أي مباريات متاحة حاليًا."}
      <button id="retry">إعادة المحاولة</button>
    </div>`;

    document.getElementById("retry").onclick = () => loadMatches(true);
    return;
  }

  box.innerHTML = list.map(match => {
    const live = isLive(match);
    const competition = match.competition?.name || "بطولة كرة قدم";

    return `<article class="card">
      <div class="meta">
        <span class="comp">🏆 ${escapeHTML(competition)}</span>
        <span class="status ${live ? "live" : ""}">
          ${live ? "🔴 " : ""}${escapeHTML(statusName(match))}
        </span>
      </div>

      <div class="teams">
        ${teamHTML(match.homeTeam, "الفريق الأول")}
        <div class="score">${escapeHTML(getScore(match))}</div>
        ${teamHTML(match.awayTeam, "الفريق الثاني")}
      </div>

      <div class="time">${escapeHTML(getTime(match))}</div>

      <div class="note">
        ${live
          ? "🔴 المباراة جارية وفقًا لبيانات مزود الخدمة."
          : match.status === "FINISHED"
            ? "✅ انتهت المباراة."
            : "📅 تابع موعد المباراة وحالتها."}
      </div>
    </article>`;
  }).join("");
}

function showError(message) {
  box.innerHTML = `<div class="state">
    ⚠️ ${escapeHTML(message)}
    <button id="retry">إعادة المحاولة</button>
  </div>`;

  document.getElementById("retry").onclick = () => loadMatches(true);
}

async function loadMatches(manual = false) {
  if (busy) return;

  busy = true;
  refreshButton.disabled = true;
  refreshButton.textContent = "⏳ جاري التحميل";

  if (!matches.length) {
    box.innerHTML = '<div class="state">⏳ جاري جلب المباريات من السيرفر...</div>';
  }

  controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "GET",
      headers: { "Accept": "application/json" },
      cache: "no-store",
      signal: controller.signal
    });

    let data;

    try {
      data = await response.json();
    } catch (_) {
      throw new Error("السيرفر لم يرجع بيانات JSON صحيحة.");
    }

    if (!response.ok || data.ok === false) {
      throw new Error(data.error || `خطأ في السيرفر: ${response.status}`);
    }

    if (!Array.isArray(data.matches)) {
      throw new Error("استجابة السيرفر لا تحتوي على قائمة المباريات.");
    }

    matches = data.matches;
    renderMatches();

    updated.textContent = "آخر تحديث: " +
      new Intl.DateTimeFormat("ar-EG", {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }).format(new Date(data.updatedAt || Date.now()));

  } catch (error) {
    console.error("Match loading error:", error);

    showError(error.name === "AbortError"
      ? "انتهت مهلة الاتصال. تحقق من السيرفر وحاول مرة أخرى."
      : error.message || "تعذر تحميل المباريات.");
  } finally {
    clearTimeout(timeout);
    busy = false;
    controller = null;
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ تحديث المباريات";
  }
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    filter = button.dataset.filter;
    renderMatches();
  });
});

refreshButton.addEventListener("click", () => loadMatches(true));

document.querySelectorAll(".nav").forEach(button => {
  button.addEventListener("click", () => {
    const page = button.dataset.page;

    document.querySelectorAll(".nav").forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    if (page === "home") {
      filter = "all";
      document.querySelectorAll(".tab").forEach(b => {
        b.classList.toggle("active", b.dataset.filter === "all");
      });
      renderMatches();
    } else if (page === "standings") {
      showError("قسم الترتيب يحتاج اختيار بطولة وربطه ببيانات جدول الترتيب.");
    } else if (page === "favorites") {
      showError("لم يتم إعداد نظام المفضلة في هذه النسخة.");
    } else {
      showError("قسم الإعدادات سيحتاج إلى إعدادات إضافية.");
    }
  });
});

loadMatches();

setInterval(() => {
  if (!document.hidden) loadMatches();
}, REFRESH_INTERVAL);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !busy) loadMatches();
});
</script>

</body>
</html>
