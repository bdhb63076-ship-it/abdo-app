<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللاسلكي - مكالمات صوتية مجانية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --primary-color: #00e676;
            --accent-red: #ff1744;
            --text-color: #ffffff;
            --border-color: #232a36;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px 16px;
        }

        header {
            width: 100%; max-width: 420px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 14px 18px; border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .logo { font-size: 18px; font-weight: bold; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
        .logo i { font-size: 22px; }

        /* الشاشة الرئيسية للاتصال */
        .main-card {
            width: 100%; max-width: 420px;
            background: var(--card-bg); border-radius: 24px;
            padding: 24px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* شاشة الحالة والروم */
        .status-box {
            width: 100%; background: #080a0e; border-radius: 16px; padding: 16px;
            border: 1px solid #1c2330; text-align: center;
        }
        .room-tag { font-size: 13px; color: #888; margin-bottom: 6px; }
        .connection-status { font-size: 18px; font-weight: bold; color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* زر الميكروفون والاتصال اللاسلكي */
        .call-btn-wrapper { position: relative; margin: 10px 0; }
        
        .talk-btn {
            width: 150px; height: 150px; border-radius: 50%;
            background: linear-gradient(145deg, #00c853, #00e676);
            border: 4px solid #b9f6ca; color: #000;
            font-size: 18px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3);
            transition: all 0.2s ease; outline: none;
        }

        .talk-btn.calling {
            background: linear-gradient(145deg, #d50000, #ff1744);
            border-color: #ff8a80; color: #fff;
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* الإعدادات واختيار القناة */
        .controls { width: 100%; display: flex; flex-direction: column; gap: 12px; }

        .input-group {
            display: flex; justify-content: space-between; align-items: center;
            background: #0d1117; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border-color); font-size: 14px;
        }

        .input-group input, .input-group select {
            background: transparent; border: none; color: #fff;
            outline: none; text-align: left; font-size: 14px; width: 60%;
        }

        .user-tag { font-size: 13px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-walkie-talkie"></i>
            <span>اللاسلكي المجاني</span>
        </div>
        <i class="fa-solid fa-signal" style="color: var(--primary-color);"></i>
    </header>

    <div class="main-card">
        <!-- شاشة حالة الاتصال -->
        <div class="status-box">
            <div class="room-tag" id="channel-name">القناة: العامة (1)</div>
            <div class="connection-status" id="call-status">
                <i class="fa-solid fa-circle-dot" style="font-size: 12px;"></i>
                جاهز للتحدث
            </div>
        </div>

        <!-- زر الاتصال والتحدث الرئيسي -->
        <div class="call-btn-wrapper">
            <button class="talk-btn" id="main-talk-btn" onclick="toggleCall()">
                <i class="fa-solid fa-phone" id="call-icon" style="font-size: 36px;"></i>
                <span id="btn-text">بدء المكالمة</span>
            </button>
        </div>

        <!-- التحكم بالقناة والاسم -->
        <div class="controls">
            <div class="input-group">
                <span>اسمك:</span>
                <input type="text" id="user-name-input" placeholder="اكتب اسمك..." onchange="updateName()">
            </div>
            <div class="input-group">
                <span>قناة الاتصال:</span>
                <select id="channel-select" onchange="changeChannel()">
                    <option value="1">القناة 1 (المباشرة)</option>
                    <option value="2">القناة 2 (الخاصة)</option>
                    <option value="3">القناة 3 (الأصدقاء)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="user-tag" id="footer-user-text">
        تحدث مجاناً عبر الإنترنت بدون رصيد ولا دقائق
    </div>

    <script>
        let isCalling = false;

        window.onload = () => {
            let savedName = localStorage.getItem('radio_call_user') || 'عبده';
            document.getElementById('user-name-input').value = savedName;
            updateName();
        };

        function updateName() {
            let name = document.getElementById('user-name-input').value.trim();
            if(!name) name = 'مستخدم';
            localStorage.setItem('radio_call_user', name);
            document.getElementById('footer-user-text').innerText = `متصل باسم: ${name}`;
        }

        function changeChannel() {
            let ch = document.getElementById('channel-select').value;
            document.getElementById('channel-name').innerText = `القناة: (${ch})`;
            if(isCalling) {
                toggleCall(); // إعادة الاتصال بالقناة الجديدة
            }
        }

        function toggleCall() {
            let btn = document.getElementById('main-talk-btn');
            let icon = document.getElementById('call-icon');
            let text = document.getElementById('btn-text');
            let status = document.getElementById('call-status');

            if (!isCalling) {
                // طلب إذن الميكروفون وبدء المكالمة اللاسلكية المباشرة
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    isCalling = true;
                    btn.classList.add('calling');
                    icon.className = 'fa-solid fa-phone-slash';
                    text.innerText = 'إنهاء المكالمة';
                    status.innerText = 'جاري التحدث عبر اللاسلكي...';
                    status.style.color = '#ff1744';
                })
                .catch(err => {
                    alert('يرجى السماح بالوصول للميكروفون لبدء المكالمة اللاسلكية!');
                });
            } else {
                isCalling = false;
                btn.classList.remove('calling');
                icon.className = 'fa-solid fa-phone';
                text.innerText = 'بدء المكالمة';
                status.innerText = 'جاهز للتحدث';
                status.style.color = '#00e676';
            }
        }
    </script>
</body>
</html>
