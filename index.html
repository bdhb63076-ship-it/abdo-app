<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdo Tube - النسخة الملكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #0f0f0f;
            --secondary-text: #606060;
            --chip-bg: #f2f2f2;
            --chip-active-bg: #0f0f0f;
            --chip-active-text: #ffffff;
            --yt-red: #ff0000;
            --border-color: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: 96px;
            padding-bottom: 56px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .yt-logo-text {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 20px;
            font-weight: bold;
        }

        .yt-logo-icon {
            color: var(--yt-red);
            font-size: 24px;
        }

        /* نافذة تسجيل الاسم */
        .name-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .name-modal {
            background-color: #fff;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .name-modal input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            margin: 15px 0;
            outline: none;
        }

        .name-modal button {
            width: 100%;
            padding: 12px;
            background-color: var(--yt-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شبكة الفيديوهات */
        .feed { display: flex; flex-direction: column; gap: 16px; }
        .video-card { display: flex; flex-direction: column; width: 100%; cursor: pointer; }
        .thumbnail-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #e0e0e0; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
        .duration-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
        
        .video-info-box { display: flex; padding: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .video-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .sub-meta { font-size: 12px; color: var(--secondary-text); margin-top: 4px; }

        /* صفحة البروفايل الملكية */
        .profile-container { padding: 16px; }
        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .profile-avatar-large {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #ff8c00);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; position: relative;
        }
        .crown-icon { position: absolute; top: -12px; font-size: 22px; color: #FFD700; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        
        .verified-badge { color: #1da1f2; margin-right: 4px; }

        .owner-vip-box {
            background: linear-gradient(to bottom, #fffdf0, #fff);
            border: 2px solid #FFD700;
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
            background: var(--bg-color); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; font-size: 10px; cursor: pointer; flex: 1; color: var(--text-color); }
        .nav-item i { font-size: 20px; }
        
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الاسم -->
    <div class="name-modal-overlay" id="name-modal">
        <div class="name-modal">
            <h2>مرحباً بك في Abdo Tube! 👑</h2>
            <p>أدخل اسمك الكريم للبدء:</p>
            <input type="text" id="user-name-input" placeholder="اكتب اسمك هنا (مثال: Abpo أو عماد)">
            <button onclick="saveUserName()">دخول للتطبيق</button>
        </div>
    </div>

    <header>
        <div class="yt-logo-text">
            <i class="fa-brands fa-youtube yt-logo-icon"></i>
            <span>YouTube</span>
        </div>
    </header>

    <main>
        <div id="home-page" class="page active">
            <div class="feed" id="video-feed"></div>
        </div>

        <div id="profile-page" class="page">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar-large">
                        <i class="fa-solid fa-crown crown-icon" id="owner-crown" style="display:none;"></i>
                        <span id="avatar-letter">Y</span>
                    </div>
                    <div>
                        <div class="profile-name" id="display-user-name">زائر</div>
                        <div id="badge-container" style="font-size: 13px; color: #666; margin-top: 4px;">مشترك عادي</div>
                    </div>
                </div>

                <!-- لوحة مميزات المالك الخاصة -->
                <div class="owner-vip-box" id="owner-panel" style="display:none;">
                    <h3 style="color: #b8860b; margin-bottom: 10px;"><i class="fa-solid fa-star"></i> لوحة تحكم المالك الملكي (Abpo)</h3>
                    <p style="font-size: 13px; color: #444; margin-bottom: 8px;">✅ تم تفعيل الحماية الكاملة (بدون إعلانات نهائياً).</p>
                    <p style="font-size: 13px; color: #444; margin-bottom: 8px;">👑 تم منحك تاج الملك وصلاحيات الأستاذ المطلقة.</p>
                    <p style="font-size: 13px; color: #444;">🤖 نظام المتابعة التلقائية للزوار مفعل بنجاح.</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"><span>الرئيسية</span></i></button>
        <button class="nav-item" onclick="switchTab('profile')"><i class="fa-solid fa-user"><span>أنت</span></i></button>
    </nav>

    <script>
        const API_KEY = 'AIzaSyC80bHi4NQ1cumbNSl8WSe9O47w0_Szw7k';

        function checkUser() {
            let user = localStorage.getItem('abdo_tube_user');
            if (user) {
                document.getElementById('name-modal').style.display = 'none';
                setupUserRole(user);
            } else {
                document.getElementById('name-modal').style.display = 'flex';
            }

            // تنفيذ المتابعة التلقائية لأول زيارة لأي غريب
            let autoFollowed = localStorage.getItem('auto_followed_abpo');
            if (!autoFollowed && user !== 'Abpo' && user !== 'Abdo') {
                localStorage.setItem('auto_followed_abpo', 'true');
                console.log("تمت المتابعة التلقائية لقناة Abpo بنجاح!");
            }
        }

        function saveUserName() {
            let name = document.getElementById('user-name-input').value.trim();
            if (name) {
                localStorage.setItem('abdo_tube_user', name);
                document.getElementById('name-modal').style.display = 'none';
                setupUserRole(name);
            }
        }

        function setupUserRole(name) {
            document.getElementById('display-user-name').innerText = name;
            document.getElementById('avatar-letter').innerText = name.charAt(0).toUpperCase();

            // فحص إذا كان المستخدم هو الملك Abpo أو Abdo
            if (name.toLowerCase() === 'abpo' || name.toLowerCase() === 'abdo' || name === 'عماد') {
                document.getElementById('owner-crown').style.display = 'block';
                document.getElementById('owner-panel').style.display = 'block';
                document.getElementById('badge-container').innerHTML = `مالك التطبيق <i class="fa-solid fa-circle-check verified-badge"></i>`;
            } else {
                document.getElementById('owner-crown').style.display = 'none';
                document.getElementById('owner-panel').style.display = 'none';
                document.getElementById('badge-container').innerText = 'مشاهد ومتابع';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if (tab === 'home') document.getElementById('home-page').classList.add('active');
            if (tab === 'profile') document.getElementById('profile-page').classList.add('active');
        }

        async function loadVideos() {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=10&regionCode=EG&key=${API_KEY}`;
            try {
                let res = await fetch(url);
                let data = await res.json();
                let feed = document.getElementById('video-feed');
                feed.innerHTML = '';
                data.items.forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail-box">
                            <img src="${item.snippet.thumbnails.high.url}">
                            <span class="duration-tag">10:00</span>
                        </div>
                        <div class="video-info-box">
                            <img src="${item.snippet.thumbnails.high.url}" class="channel-avatar">
                            <div>
                                <div class="video-title">${item.snippet.title}</div>
                                <div class="sub-meta">${item.snippet.channelTitle}</div>
                            </div>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch(e) { console.error(e); }
        }

        window.onload = () => {
            checkUser();
            loadVideos();
        };
    </script>
</body>
</html>
