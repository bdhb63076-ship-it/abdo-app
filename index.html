<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Tube - عبده تيوپ المتكامل</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-red: #ff0000;
            --gold-color: #ffd700;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #202020;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .search-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 15px;
        }

        .search-bar {
            display: flex;
            flex-grow: 1;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 15px;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
        }

        .search-bar button, .mic-btn {
            background: #303030;
            border: none;
            color: #fff;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 50%;
        }

        .mic-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #272727;
        }

        .mic-btn.listening {
            background: var(--accent-red);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vip-badge {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #181818;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        nav button {
            background: #272727;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
        }

        nav button.active {
            background: #fff;
            color: #000;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-card video, .video-card iframe {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: none;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .video-stats {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        /* Shorts Section */
        .shorts-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .short-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            height: 580px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .short-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .short-actions {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .sub-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-form {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-form input, .upload-form select, .upload-form button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #272727;
            color: #fff;
        }

        .upload-form button {
            background: var(--accent-red);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Abdo Tube <span id="vipTag" class="vip-badge" style="display:none;">VIP PRO</span></div>
        
        <div class="search-bar-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="بحث...">
                <button onclick="performSearch()">🔍</button>
            </div>
            <button class="mic-btn" id="micBtn" onclick="startVoiceSearch()" title="بحث صوتي">🎙️</button>
        </div>

        <div class="user-section">
            <span id="userName">زائر</span>
            <button onclick="loginPrompt()" style="background:none; border:none; color:var(--text-secondary); cursor:pointer;">👤</button>
        </div>
    </header>

    <nav>
        <button class="active" onclick="switchTab('home', this)">الرئيسية</button>
        <button onclick="switchTab('shorts', this)">Shorts ⚡</button>
        <button onclick="switchTab('upload', this)">رفع فيديو 📤</button>
    </nav>

    <div class="container">
        <!-- الرئيسية -->
        <div id="home" class="section active">
            <div class="video-grid" id="videoGrid"></div>
        </div>

        <!-- Shorts -->
        <div id="shorts" class="section">
            <div class="shorts-container" id="shortsContainer"></div>
        </div>

        <!-- رفع فيديو -->
        <div id="upload" class="section">
            <div class="upload-form">
                <h3>رفع فيديو جديد من التليفون</h3>
                <input type="text" id="uploadTitle" placeholder="عنوان الفيديو" required>
                <select id="uploadType">
                    <option value="video">فيديو عادي</option>
                    <option value="short">فيديو قصير (Shorts)</option>
                </select>
                <input type="file" id="uploadFile" accept="video/*" required>
                <button onclick="handleFileUpload()">نشر الفيديو</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('abdo_user') || 'زائر';
        let videos = JSON.parse(localStorage.getItem('abdo_videos')) || [
            { id: 1, title: 'أول فيديو تجريبي على المنصة', type: 'video', views: 120, likes: 15, author: 'Abpo', src: '' },
            { id: 2, title: 'شورتس تجريبي مميز ⚡', type: 'short', views: 450, likes: 89, author: 'Abpo', src: '' }
        ];

        function init() {
            updateUserDisplay();
            renderVideos(videos);
            renderShorts(videos);
        }

        function updateUserDisplay() {
            document.getElementById('userName').innerText = currentUser;
            if(currentUser.toLowerCase() === 'abpo') {
                document.getElementById('vipTag').style.display = 'inline';
            } else {
                document.getElementById('vipTag').style.display = 'none';
            }
        }

        function loginPrompt() {
            let name = prompt("أدخل اسم المستخدم:", currentUser);
            if(name) {
                currentUser = name;
                localStorage.setItem('abdo_user', currentUser);
                updateUserDisplay();
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderVideos(list) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            list.filter(v => v.type === 'video').forEach(v => {
                grid.innerHTML += `
                    <div class="video-card">
                        ${v.src ? `<video src="${v.src}" controls></video>` : `<div style="height:180px;background:#333;display:flex;align-items:center;justify-content:center;">فيديو توضيحي</div>`}
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-stats">
                                <span>القناة: ${v.author}</span>
                                <span>👁️ ${v.views} مشاهدة</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderShorts(list) {
            const container = document.getElementById('shortsContainer');
            container.innerHTML = '';
            list.filter(v => v.type === 'short').forEach(v => {
                container.innerHTML += `
                    <div class="short-card">
                        ${v.src ? `<video src="${v.src}" controls loop></video>` : `<div style="height:100%;background:#222;display:flex;align-items:center;justify-content:center;">Shorts Video</div>`}
                        <div class="short-actions">
                            <button class="action-btn" onclick="likeVideo(${v.id})">❤️<br>${v.likes}</button>
                            <button class="action-btn">💬<br>12</button>
                        </div>
                        <div class="short-overlay">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <strong>@${v.author}</strong>
                                <button class="sub-btn" onclick="subscribe(this)">اشتراك</button>
                            </div>
                            <p>${v.title}</p>
                        </div>
                    </div>
                `;
            });
        }

        function handleFileUpload() {
            const title = document.getElementById('uploadTitle').value;
            const type = document.getElementById('uploadType').value;
            const fileInput = document.getElementById('uploadFile');

            if(!title || !fileInput.files[0]) {
                alert('يرجى ملء جميع البيانات واختيار فيديو');
                return;
            }

            const file = fileInput.files[0];
            const url = URL.createObjectURL(file);

            const newVid = {
                id: Date.now(),
                title: title,
                type: type,
                views: 1,
                likes: 0,
                author: currentUser,
                src: url
            };

            videos.unshift(newVid);
            localStorage.setItem('abdo_videos', JSON.stringify(videos));
            alert('تم نشر الفيديو بنجاح!');
            renderVideos(videos);
            renderShorts(videos);
            switchTab(type === 'short' ? 'shorts' : 'home', document.querySelectorAll('nav button')[type === 'short' ? 1 : 0]);
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
            renderShorts(filtered);
        }

        function startVoiceSearch() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('البحث الصوتي غير مدعوم في متصفحك.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';

            recognition.onstart = function() {
                micBtn.classList.add('listening');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('searchInput').value = transcript;
                micBtn.classList.remove('listening');
                performSearch();
            };

            recognition.onerror = function() {
                micBtn.classList.remove('listening');
            };

            recognition.onend = function() {
                micBtn.classList.remove('listening');
            };

            recognition.start();
        }

        function likeVideo(id) {
            const vid = videos.find(v => v.id === id);
            if(vid) {
                vid.likes++;
                localStorage.setItem('abdo_videos', JSON.stringify(videos));
                renderShorts(videos);
            }
        }

        function subscribe(btn) {
            btn.innerText = 'تم الاشتراك';
            btn.style.background = '#555';
        }

        window.onload = init;
    </script>
</body>
</html>
