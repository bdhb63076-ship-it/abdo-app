<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللاسلكي الملكي - السيرفر الرئيسي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة الاتصال السريع المباشر بالسيرفر -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0d14;
            --card-bg: #141923;
            --green-active: #00e676;
            --red-cancel: #ff1744;
            --gold-color: #FFD700;
            --text-main: #ffffff;
            --border-line: #222a38;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px 15px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .modal-box {
            background: var(--card-bg); padding: 25px; border-radius: 20px;
            width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border-line);
        }
        .modal-box input {
            width: 100%; padding: 14px; background: #080a0f; border: 1px solid var(--border-line);
            border-radius: 10px; color: #fff; font-size: 16px; margin: 15px 0; outline: none; text-align: center;
        }
        .modal-box button {
            width: 100%; padding: 14px; background: var(--green-active); color: #000;
            border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        header {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px; border-radius: 16px;
            border: 1px solid var(--border-line);
        }
        .logo { font-size: 18px; font-weight: bold; color: var(--green-active); display: flex; align-items: center; gap: 8px; }

        .app-card {
            width: 100%; max-width: 400px;
            background: var(--card-bg); border-radius: 24px;
            padding: 25px; border: 1px solid var(--border-line);
            display: flex; flex-direction: column; gap: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .owner-badge-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.1));
            border: 1px solid var(--gold-color); border-radius: 14px; padding: 12px;
            display: none; align-items: center; justify-content: center; gap: 8px;
            color: var(--gold-color); font-weight: bold; font-size: 14px;
        }

        .my-code-card {
            background: #080a0f; border: 1px dashed var(--green-active);
            border-radius: 16px; padding: 15px;
        }
        .my-code-card span { font-size: 13px; color: #aaa; }
        .code-display { font-size: 32px; font-weight: bold; color: var(--green-active); letter-spacing: 6px; margin-top: 5px; }

        .search-box { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .search-box label { font-size: 14px; color: #ddd; text-align: right; }
        .search-box input {
            width: 100%; padding: 15px; background: #080a0f; border: 1px solid var(--border-line);
            border-radius: 12px; color: #fff; font-size: 22px; text-align: center; letter-spacing: 5px; outline: none;
        }
        .call-btn {
            width: 100%; padding: 15px; background: var(--green-active); color: #000;
            border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .calling-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 13, 20, 0.98); display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 25px; z-index: 10000; padding: 20px;
        }
        .avatar-ring {
            width: 110px; height: 110px; border-radius: 50%; background: var(--card-bg);
            border: 3px solid var(--green-active); display: flex; align-items: center;
            justify-content: center; font-size: 45px; color: var(--green-active);
            animation: ringAnim 1.2s infinite;
        }
        @keyframes ringAnim {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }
        .footer-note { font-size: 13px; color: #777; text-align: center; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="register-modal">
        <div class="modal-box">
            <h2>🎙️ اللاسلكي الملكي</h2>
            <p style="font-size:13px; color:#aaa; margin-top:8px;">اكتب اسمك للاتصال (اكتب عبده لتفعيل العرش):</p>
            <input type="text" id="user-name-input" placeholder="اسمك هنا...">
            <button onclick="saveUserAndConnect()">دخول وسحب الكود</button>
        </div>
    </div>

    <div class="calling-overlay" id="call-screen">
        <div class="avatar-ring">
            <i class="fa-solid fa-walkie-talkie"></i>
        </div>
        <h2 id="calling-target-text" style="font-size: 20px;">جاري الاتصال...</h2>
        <p id="call-sub-text" style="color: #aaa; font-size: 14px;">انتظر رد الطرف الآخر</p>
        <div id="incoming-actions" style="display:none; gap: 15px;">
            <button onclick="answerCall()" style="background: var(--green-active); color: #000; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer;">رد الآن</button>
        </div>
        <button onclick="endCall()" style="background: var(--red-cancel); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer;">
            إنهاء المكالمة
        </button>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <header>
        <div class="logo">
            <i class="fa-solid fa-tower-cell"></i>
            <span>اللاسلكي الملكي</span>
        </div>
        <span id="header-user-name" style="font-size: 13px; color: #aaa;">زائر</span>
    </header>

    <div class="app-card">
        <div class="owner-badge-box" id="owner-panel">
            <i class="fa-solid fa-crown"></i>
            <span>مالك التطبيق الرسمي (عبده)</span>
        </div>

        <div class="my-code-card">
            <span>كود اللاسلكي الخاص بك:</span>
            <div class="code-display" id="my-5digit-code">جار الاتصال بالسيرفر...</div>
        </div>

        <div class="search-box">
            <label>اكتب كود الصديق (5 أرقام):</label>
            <input type="text" id="target-code-input" maxlength="5" placeholder="أدخل الكود">
            <button class="call-btn" onclick="startCallProcess()">
                <i class="fa-solid fa-phone"></i>
                <span>رن على الصديق</span>
            </button>
        </div>
    </div>

    <div class="footer-note" style="display:flex; justify-content:center; align-items:center; gap:15px;">
        <span id="footer-details">متصل بسيرفرك الخاص</span>
        <button onclick="resetAppData()" style="background:#222; border:1px solid #444; color:#ff1744; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer;">إعادة ضبط</button>
    </div>

    <script>
        // ضع هنا رابط سيرفرك الخاص (الذي يعمل 24 ساعة)
        const SERVER_URL = 'https://your-custom-server.com'; 
        
        let socket = null;
        let myCode = '';
        let myName = '';
        let localStream = null;
        let ringToneAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3');
        ringToneAudio.loop = true;

        window.onload = () => {
            let savedName = localStorage.getItem('wt_user_name_v8');
            let savedCode = localStorage.getItem('wt_user_code_v8');

            if (savedName && savedCode) {
                myName = savedName;
                myCode = savedCode;
                document.getElementById('register-modal').style.display = 'none';
                connectToServer(myCode);
                setupUserPanel();
            } else {
                document.getElementById('register-modal').style.display = 'flex';
            }
        };

        function saveUserAndConnect() {
            let nameInp = document.getElementById('user-name-input').value.trim();
            if (!nameInp) nameInp = "مستخدم";
            myName = nameInp;
            myCode = Math.floor(10000 + Math.random() * 90000).toString();

            localStorage.setItem('wt_user_name_v8', myName);
            localStorage.setItem('wt_user_code_v8', myCode);

            document.getElementById('register-modal').style.display = 'none';
            connectToServer(myCode);
            setupUserPanel();
        }

        function connectToServer(code) {
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                socket.emit('register_user', { code: code, name: myName });
                document.getElementById('my-5digit-code').innerText = code;
            });

            // استقبال طلب الرنين من صديق
            socket.on('incoming_call', (data) => {
                ringToneAudio.play().catch(e => {});
                document.getElementById('calling-target-text').innerText = `مكالمة واردة من: ${data.fromName}`;
                document.getElementById('call-sub-text').innerText = `الكود المتصل: ${data.fromCode}`;
                document.getElementById('incoming-actions').style.display = 'flex';
                document.getElementById('call-screen').style.display = 'flex';
            });

            socket.on('call_rejected', () => {
                alert('الطرف الآخر مشغول أو رفض المكالمة.');
                endCall();
            });

            socket.on('user_offline', () => {
                alert('هذا الكود غير متصل حالياً بالسيرفر!');
                endCall();
            });
        }

        function startCallProcess() {
            let targetCode = document.getElementById('target-code-input').value.trim();
            if (targetCode.length !== 5) {
                alert('أدخل الكود الصحيح المكون من 5 أرقام!');
                return;
            }
            if (targetCode === myCode) {
                alert('لا يمكنك الاتصال برقمك الشخصي!');
                return;
            }

            document.getElementById('calling-target-text').innerText = `جاري الرن على (${targetCode})...`;
            document.getElementById('call-sub-text').innerText = "في انتظار رد الصديق...";
            document.getElementById('call-screen').style.display = 'flex';
            ringToneAudio.play().catch(e => {});

            socket.emit('call_user', { targetCode: targetCode, myCode: myCode, myName: myName });
        }

        function answerCall() {
            ringToneAudio.pause();
            ringToneAudio.currentTime = 0;
            document.getElementById('incoming-actions').style.display = 'none';
            document.getElementById('call-sub-text').innerText = "متصل الآن عبر السيرفر 🎙️";
            
            // تفعيل الميكروفون وبدء نقل الصوت
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
            }).catch(e => alert('يجب السماح بالميكروفون!'));
        }

        function endCall() {
            ringToneAudio.pause();
            ringToneAudio.currentTime = 0;
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('call-screen').style.display = 'none';
            document.getElementById('incoming-actions').style.display = 'none';
            document.getElementById('target-code-input').value = '';
        }

        function setupUserPanel() {
            document.getElementById('header-user-name').innerText = myName;
            let lower = myName.toLowerCase();
            if (lower === 'abdo' || lower === 'abpo' || myName === 'عبده') {
                document.getElementById('owner-panel').style.display = 'flex';
                document.getElementById('footer-details').innerHTML = `👑 مالك التطبيق: <b>${myName}</b>`;
            } else {
                document.getElementById('owner-panel').style.display = 'none';
                document.getElementById('footer-details').innerText = `المستخدم: ${myName}`;
            }
        }

        function resetAppData() {
            if (confirm("إعادة ضبط التطبيق؟")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
