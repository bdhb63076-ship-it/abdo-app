<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Tube - عبده تيوپ</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-red: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo span.yt-red {
            background: var(--accent-red);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
            max-width: 250px;
            margin: 0 10px;
        }

        .search-container input {
            width: 100%;
            padding: 6px 12px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .mic-btn {
            background: #222;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mic-btn.listening {
            background: var(--accent-red);
        }

        /* Layout Main */
        .container {
            padding: 10px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Feed Videos */
        .video-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .feed-card {
            background: #0f0f0f;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .feed-info {
            padding: 10px 5px;
            display: flex;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .feed-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .feed-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
        }

        .feed-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Shorts Feed */
        .shorts-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .short-card {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 580px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .short-card iframe, .short-card video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .short-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }

        .sub-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bottom Navigation Bar (YouTube App Style) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item .icon {
            font-size: 18px;
        }

        .plus-btn {
            font-size: 28px;
            line-height: 1;
            color: #fff;
        }

        /* Upload Form */
        .upload-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-box input, .upload-box select, .upload-box button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #272727;
            color: #fff;
        }

        .upload-box button {
            background: var(--accent-red);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="yt-red">▶</span> AbdoTube
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="بحث...">
            <button class="mic-btn" id="micBtn" onclick="startVoiceSearch()">🎙️</button>
        </div>
        <div id="userBadge" style="font-size: 12px; font-weight: bold;">زائر</div>
    </header>

    <div class="container">
        <!-- الصفحة الرئيسية -->
        <div id="home" class="section active">
            <div class="video-feed" id="videoFeed"></div>
        </div>

        <!-- Shorts -->
        <div id="shorts" class="section">
            <div class="shorts-grid" id="shortsGrid"></div>
        </div>

        <!-- رفع فيديو -->
        <div id="upload" class="section">
            <div class="upload-box">
                <h3>إنشاء فيديو جديد 📤</h3>
                <input type="text" id="uploadTitle" placeholder="عنوان الفيديو">
                <select id="uploadType">
                    <option value="video">فيديو عادي</option>
                    <option value="short">فيديو قصير (Shorts)</option>
                </select>
                <input type="file" id="uploadFile" accept="video/*">
                <button onclick="uploadVideo()">نشر الآن</button>
            </div>
        </div>

        <!-- الاشتراكات -->
        <div id="subs" class="section">
            <h3 style="text-align: center; margin-top: 30px;">قنواتك المشترك فيها تظهر هنا 👍</h3>
        </div>

        <!-- حسابك (أنت) -->
        <div id="profile" class="section">
            <div style="text-align: center; margin-top: 20px;">
                <h2 id="profileName">Abpo</h2>
                <p style="color:var(--text-secondary); margin-top: 5px;">المطور والمالك VIP 👑</p>
                <button onclick="changeName()" style="margin-top: 15px; padding: 8px 15px; background:#333; color:#fff; border:none; border-radius:5px;">تغيير الاسم</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي (شبه يوتيوب) -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchTab('shorts', this)">
            <span class="icon">⚡</span>
            <span>Shorts</span>
        </button>
        <button class="nav-item" onclick="switchTab('upload', this)">
            <span class="icon plus-btn">+</span>
        </button>
        <button class="nav-item" onclick="switchTab('subs', this)">
            <span class="icon">🔔</span>
            <span>الاشتراكات</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span class="icon">👤</span>
            <span>أنت</span>
        </button>
    </div>

    <script>
        let currentUser = localStorage.getItem('abdo_user') || 'Abpo';

        // قائمة فيديوهات يوتيوب حقيقية مدرجة
        let defaultVideos = [
            {
                id: '1',
                title: 'لما يحصل حاجات غريبه متتوقعهاش من ابوك وامك - الجزء الثالث',
                author: 'Bassem Otaka',
                views: '8.6 مليون',
                embedUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', // مثال رابط
                type: 'video'
            },
            {
                id: '2',
                title: 'هل اقدر احقق الكرة الذهبية بلاعب معتزل؟',
                author: 'Syrian Gamer - سوري جيمر',
                views: '1.2 مليون',
                embedUrl: 'https://www.youtube.com/embed/3JZ_D3ELwOQ',
                type: 'video'
            }
        ];

        let defaultShorts = [
            {
                id: 's1',
                title: 'تحدي وسرعة ⚡',
                author: 'Abpo',
                embedUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                likes: '250K'
            }
        ];

        function init() {
            document.getElementById('userBadge').innerText = currentUser;
            document.getElementById('profileName').innerText = currentUser;
            renderHomeFeed();
            renderShortsFeed();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function renderHomeFeed() {
            const feed = document.getElementById('videoFeed');
            feed.innerHTML = '';
            defaultVideos.forEach(v => {
                feed.innerHTML += `
                    <div class="feed-card">
                        <div class="video-wrapper">
                            ${v.src ? `<video src="${v.src}" controls></video>` : `<iframe src="${v.embedUrl}" allowfullscreen></iframe>`}
                        </div>
                        <div class="feed-info">
                            <div class="channel-avatar">${v.author[0]}</div>
                            <div class="feed-details">
                                <div class="feed-title">${v.title}</div>
                                <div class="feed-meta">${v.author} • ${v.views} مشاهدة</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderShortsFeed() {
            const grid = document.getElementById('shortsGrid');
            grid.innerHTML = '';
            defaultShorts.forEach(s => {
                grid.innerHTML += `
                    <div class="short-card">
                        ${s.src ? `<video src="${s.src}" controls loop></video>` : `<iframe src="${s.embedUrl}" allowfullscreen></iframe>`}
                        <div class="short-overlay">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span>@${s.author}</span>
                                <button class="sub-btn" onclick="this.innerText='تم الاشتراك'">اشتراك</button>
                            </div>
                            <p style="margin-top:5px; font-size:13px;">${s.title}</p>
                        </div>
                    </div>
                `;
            });
        }

        function uploadVideo() {
            const title = document.getElementById('uploadTitle').value;
            const type = document.getElementById('uploadType').value;
            const fileInput = document.getElementById('uploadFile');

            if(!title || !fileInput.files[0]) {
                alert('اختر فيديو واكتب العنوان الأول');
                return;
            }

            const url = URL.createObjectURL(fileInput.files[0]);

            if(type === 'video') {
                defaultVideos.unshift({
                    id: Date.now().toString(),
                    title: title,
                    author: currentUser,
                    views: '1',
                    src: url,
                    type: 'video'
                });
                renderHomeFeed();
                switchTab('home');
            } else {
                defaultShorts.unshift({
                    id: Date.now().toString(),
                    title: title,
                    author: currentUser,
                    src: url,
                    likes: '1'
                });
                renderShortsFeed();
                switchTab('shorts');
            }
            alert('تم نشر الفيديو بنجاح!');
        }

        function startVoiceSearch() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('البحث الصوتي غير مدعوم على متصفحك');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';

            recognition.onstart = () => micBtn.classList.add('listening');
            recognition.onresult = (e) => {
                document.getElementById('searchInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
            recognition.start();
        }

        function changeName() {
            let n = prompt("ادخل اسمك الجديد:", currentUser);
            if(n) {
                currentUser = n;
                localStorage.setItem('abdo_user', n);
                init();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
