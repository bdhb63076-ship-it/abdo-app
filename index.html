<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللاسلكي برقم الاتصال - 5 أرقام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --primary-color: #00e676;
            --accent-red: #ff1744;
            --text-color: #ffffff;
            --border-color: #232a36;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px 16px;
        }

        header {
            width: 100%; max-width: 420px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 14px 18px; border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .logo { font-size: 18px; font-weight: bold; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }

        /* نافذة تسجيل الاسم الأولية */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center;
            z-index: 5000; padding: 20px;
        }
        .modal-box {
            background: var(--card-bg); padding: 24px; border-radius: 20px;
            width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--border-color);
        }
        .modal-box input {
            width: 100%; padding: 12px; background: #0a0c10; border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; font-size: 16px; margin: 15px 0; outline: none; text-align: center;
        }
        .modal-box button {
            width: 100%; padding: 12px; background: var(--primary-color); color: #000;
            border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;
        }

        /* الكارت الرئيسي للاتصال برقم من 5 أرقام */
        .main-card {
            width: 100%; max-width: 420px;
            background: var(--card-bg); border-radius: 24px;
            padding: 24px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .my-code-box {
            background: #0a0c10; border: 1px solid var(--border-color);
            border-radius: 14px; padding: 12px; width: 100%; text-align: center;
        }
        .code-number { font-size: 26px; font-weight: bold; color: #3ea6ff; letter-spacing: 4px; margin-top: 4px; }

        .search-call-box {
            width: 100%; display: flex; flex-direction: column; gap: 10px;
        }
        .search-call-box input {
            width: 100%; padding: 14px; background: #0a0c10; border: 1px solid var(--border-color);
            border-radius: 12px; color: #fff; font-size: 18px; text-align: center; letter-spacing: 3px; outline: none;
        }
        .call-action-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #00c853, #00e676);
            color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .call-action-btn.ringing {
            background: linear-gradient(135deg, #d50000, #ff1744); color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .status-text { font-size: 14px; color: var(--primary-color); text-align: center; min-height: 20px; }
        .footer-info { font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الاسم الأولى -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h2>📞 نظام الاتصال اللاسلكي</h2>
            <p style="font-size:13px; color:#aaa; margin-top:8px;">اكتب اسمك ليتم إنشاء رقمك الخاص:</p>
            <input type="text" id="username-input" placeholder="اسمك هنا...">
            <button onclick="registerUser()">دخول للنظام</button>
        </div>
    </div>

    <header>
        <div class="logo">
            <i class="fa-solid fa-walkie-talkie"></i>
            <span>اتصال بـ 5 أرقام</span>
        </div>
        <i class="fa-solid signal" id="user-display-badge" style="font-size: 13px; color: #aaa;">زائر</i>
    </header>

    <div class="main-card">
        <!-- رقمك السري الخاص -->
        <div class="my-code-box">
            <div style="font-size: 12px; color: #888;">رقمك السري للاتصال بك:</div>
            <div class="code-number" id="my-five-code">-----</div>
        </div>

        <!-- خانة البحث والاتصال برقم صديق -->
        <div class="search-call-box">
            <label style="font-size: 13px; color: #ccc;">اكتب رقم الصديق (5 أرقام):</label>
            <input type="text" id="target-code-input" maxlength="5" placeholder="00000">
            <button class="call-action-btn" id="call-btn" onclick="triggerCall()">
                <i class="fa-solid fa-phone"></i>
                <span>بدء الاتصال برقم الصديق</span>
            </button>
        </div>

        <div class="status-text" id="call-status-msg">أدخل الرقم واضغط اتصال للبدء...</div>
    </div>

    <div class="footer-info" id="footer-owner-text">
        مكالمات لاسلكية فورية بدون دقائق ولا رصيد
    </div>

    <script>
        let myCode = '';
        let myName = '';
        let isCalling = false;

        window.onload = () => {
            let savedName = localStorage.getItem('radio_user_name');
            let savedCode = localStorage.getItem('radio_user_code');

            if (savedName && savedCode) {
                myName = savedName;
                myCode = savedCode;
                document.getElementById('login-modal').style.display = 'none';
                initAppPanel();
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        };

        function registerUser() {
            let input = document.getElementById('username-input').value.trim();
            if (!input) input = "مستخدم";
            
            myName = input;
            // توليد رقم عشوائي مكون من 5 أرقام للمستخدم
            myCode = Math.floor(10000 + Math.random() * 90000).toString();

            localStorage.setItem('radio_user_name', myName);
            localStorage.setItem('radio_user_code', myCode);

            document.getElementById('login-modal').style.display = 'none';
            initAppPanel();
        }

        function initAppPanel() {
            document.getElementById('my-five-code').innerText = myCode;
            let displayName = myName;
            if(myName.toLowerCase() === 'عبده' || myName.toLowerCase() === 'abpo') {
                displayName = "👑 عبده (المالك)";
            }
            document.getElementById('user-display-badge').innerText = displayName;
            document.getElementById('footer-owner-text').innerText = `متصل باسم: ${displayName} | رقمك: ${myCode}`;
        }

        function triggerCall() {
            let targetCode = document.getElementById('target-code-input').value.trim();
            let btn = document.getElementById('call-btn');
            let status = document.getElementById('call-status-msg');

            if (targetCode.length !== 5) {
                alert('يرجى إدخال رقم صحيح مكون من 5 أرقام!');
                return;
            }

            if (targetCode === myCode) {
                alert('لا يمكنك الاتصال برقمك الشخصي!');
                return;
            }

            if (!isCalling) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    isCalling = true;
                    btn.classList.add('ringing');
                    btn.innerHTML = '<i class="fa-solid fa-phone-slash"></i> <span>إنهاء المكالمة</span>';
                    status.innerText = `جاري الاتصال بالرقم (${targetCode})... يرجى الانتظار`;
                    status.style.color = '#ff1744';
                })
                .catch(err => {
                    alert('يرجى السماح بالوصول للميكروفون لبدء المكالمة الصوتية!');
                });
            } else {
                isCalling = false;
                btn.classList.remove('ringing');
                btn.innerHTML = '<i class="fa-solid fa-phone"></i> <span>بدء الاتصال برقم الصديق</span>';
                status.innerText = 'تم إنهاء المكالمة.';
                status.style.color = '#00e676';
                document.getElementById('target-code-input').value = '';
            }
        }
    </script>
</body>
</html>
