<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللاسلكي الملكي - مكالمات وإشعارات فورية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0d14;
            --card-bg: #141923;
            --green-active: #00e676;
            --red-cancel: #ff1744;
            --gold-color: #FFD700;
            --text-main: #ffffff;
            --border-line: #222a38;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px 15px;
        }

        /* نافذة التسجيل الأولى */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .modal-box {
            background: var(--card-bg); padding: 25px; border-radius: 20px;
            width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border-line);
        }
        .modal-box input {
            width: 100%; padding: 14px; background: #080a0f; border: 1px solid var(--border-line);
            border-radius: 10px; color: #fff; font-size: 16px; margin: 15px 0; outline: none; text-align: center;
        }
        .modal-box button {
            width: 100%; padding: 14px; background: var(--green-active); color: #000;
            border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        /* الهيدر العلوي */
        header {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px; border-radius: 16px;
            border: 1px solid var(--border-line);
        }
        .logo { font-size: 18px; font-weight: bold; color: var(--green-active); display: flex; align-items: center; gap: 8px; }

        .user-info-head { display: flex; align-items: center; gap: 8px; }
        .edit-name-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; }

        /* الكارت الرئيسي */
        .app-card {
            width: 100%; max-width: 400px;
            background: var(--card-bg); border-radius: 24px;
            padding: 25px; border: 1px solid var(--border-line);
            display: flex; flex-direction: column; gap: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        /* لوحة تحكم المالك الملكي */
        .owner-badge-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.1));
            border: 1px solid var(--gold-color); border-radius: 14px; padding: 12px;
            display: none; align-items: center; justify-content: center; gap: 8px;
            color: var(--gold-color); font-weight: bold; font-size: 14px;
        }

        /* زر تفعيل الإشعارات برة المتصفح */
        .noti-btn-box {
            background: #080a0f; border: 1px solid #2a3447;
            border-radius: 12px; padding: 10px; display: flex;
            align-items: center; justify-content: space-between; font-size: 13px; color: #ccc;
        }
        .noti-btn-box button {
            background: #232d3f; border: 1px solid var(--green-active);
            color: var(--green-active); padding: 6px 12px; border-radius: 8px;
            cursor: pointer; font-size: 12px; font-weight: bold;
        }

        /* عرض كود المستخدم الخاص */
        .my-code-card {
            background: #080a0f; border: 1px dashed var(--green-active);
            border-radius: 16px; padding: 15px;
        }
        .my-code-card span { font-size: 13px; color: #aaa; }
        .code-display { font-size: 32px; font-weight: bold; color: var(--green-active); letter-spacing: 6px; margin-top: 5px; }

        /* منطقة البحث والاتصال */
        .search-box { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .search-box label { font-size: 14px; color: #ddd; text-align: right; }
        .search-box input {
            width: 100%; padding: 15px; background: #080a0f; border: 1px solid var(--border-line);
            border-radius: 12px; color: #fff; font-size: 22px; text-align: center; letter-spacing: 5px; outline: none;
        }
        .call-btn {
            width: 100%; padding: 15px; background: var(--green-active); color: #000;
            border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;
        }

        /* شاشة الاتصال والرنين المباشر */
        .calling-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 13, 20, 0.98); display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 25px; z-index: 10000; padding: 20px;
        }
        .avatar-ring {
            width: 110px; height: 110px; border-radius: 50%; background: var(--card-bg);
            border: 3px solid var(--green-active); display: flex; align-items: center;
            justify-content: center; font-size: 45px; color: var(--green-active);
            animation: ringAnim 1.2s infinite;
        }
        @keyframes ringAnim {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        .footer-note { font-size: 13px; color: #777; text-align: center; }
    </style>
</head>
<body>

    <!-- نافذة التسجيل الأولى -->
    <div class="modal-overlay" id="register-modal">
        <div class="modal-box">
            <h2>🎙️ اللاسلكي الملكي</h2>
            <p style="font-size:13px; color:#aaa; margin-top:8px;">ادخل اسمك لمرة واحدة فقط (اكتب عبده للعرش الملكي):</p>
            <input type="text" id="user-name-input" placeholder="اسمك هنا...">
            <button onclick="saveUserAndStart()">دخول واستلام الكود</button>
        </div>
    </div>

    <!-- شاشة الاتصال والرنين المباشر -->
    <div class="calling-overlay" id="call-screen">
        <div class="avatar-ring">
            <i class="fa-solid fa-walkie-talkie"></i>
        </div>
        <h2 id="calling-target-text" style="font-size: 20px;">جاري الرن على الرقم...</h2>
        <p style="color: #aaa; font-size: 14px;">يرجى الانتظار حتى يتم الرد من اللاسلكي</p>
        <button onclick="endCall()" style="background: var(--red-cancel); color: #fff; border: none; padding: 15px 35px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer;">
            <i class="fa-solid fa-phone-slash"></i> إنهاء المكالمة
        </button>
    </div>

    <header>
        <div class="logo">
            <i class="fa-solid fa-tower-cell"></i>
            <span>اللاسلكي الملكي</span>
        </div>
        <div class="user-info-head">
            <span id="header-user-name" style="font-size: 13px; color: #aaa;">زائر</span>
            <button class="edit-name-btn" onclick="reRegister()" title="تعديل الاسم"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>
    </header>

    <div class="app-card">
        <!-- لوحة تحكم المالك الملكي -->
        <div class="owner-badge-box" id="owner-panel">
            <i class="fa-solid fa-crown"></i>
            <span>مالك التطبيق الرسمي (عبده)</span>
        </div>

        <!-- زر تفعيل الإشعارات الخارجية -->
        <div class="noti-btn-box">
            <span>🔔 الرنين برة المتصفح:</span>
            <button id="noti-status-btn" onclick="requestNotificationPermission()">تفعيل الرنين</button>
        </div>

        <!-- كود المستخدم الخاص (5 أرقام) -->
        <div class="my-code-card">
            <span>رقم اللاسلكي الثابت الخاص بك:</span>
            <div class="code-display" id="my-5digit-code">-----</div>
        </div>

        <!-- البحث برقم الصديق والاتصال -->
        <div class="search-box">
            <label>اكتب كود صديقك (5 أرقام) للاتصال به:</label>
            <input type="text" id="target-code-input" maxlength="5" placeholder="مثال: 58291">
            <button class="call-btn" onclick="startCallProcess()">
                <i class="fa-solid fa-phone"></i>
                <span>رن على الصديق</span>
            </button>
        </div>
    </div>

    <div class="footer-note" id="footer-details">
        مكالمات صوتية مباشرة برقم الكود بدون دقائق ولا رصيد
    </div>

    <script>
        let myCode = '';
        let myName = '';
        let ringToneAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3');
        ringToneAudio.loop = true;

        window.onload = () => {
            let savedName = localStorage.getItem('wt_user_name_v4');
            let savedCode = localStorage.getItem('wt_user_code_v4');

            if (savedName && savedCode) {
                myName = savedName;
                myCode = savedCode;
                document.getElementById('register-modal').style.display = 'none';
                setupUserPanel();
            } else {
                document.getElementById('register-modal').style.display = 'flex';
            }

            checkNotificationPermissionStatus();
        };

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("تم تفعيل رنين الإشعارات بنجاح! هتوصلك الرنة حتى وأنت برة المتصفح.");
                        checkNotificationPermissionStatus();
                    } else {
                        alert("يرجى السماح بالإشعارات لتلقي المكالمات برة المتصفح!");
                    }
                });
            } else {
                alert("متصفحك لا يدعم الإشعارات الخارجية.");
            }
        }

        function checkNotificationPermissionStatus() {
            let btn = document.getElementById('noti-status-btn');
            if ("Notification" in window && Notification.permission === "granted") {
                btn.innerText = "مفعل ✅";
                btn.style.borderColor = "#00e676";
                btn.style.color = "#00e676";
            }
        }

        function sendExternalCallNotification(callerName, targetCode) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`📞 مكالمة لاسلكية واردة!`, {
                    body: `الرقم (${targetCode}) يحاول الاتصال بك الآن عبر اللاسلكي! اضغط للرد.`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3616/3616215.png',
                    requireInteraction: true
                });
            }
        }

        function saveUserAndStart() {
            let nameInp = document.getElementById('user-name-input').value.trim();
            if (!nameInp) nameInp = "مستخدم";

            myName = nameInp;
            myCode = Math.floor(10000 + Math.random() * 90000).toString();

            localStorage.setItem('wt_user_name_v4', myName);
            localStorage.setItem('wt_user_code_v4', myCode);

            document.getElementById('register-modal').style.display = 'none';
            setupUserPanel();
        }

        function reRegister() {
            let newName = prompt("اكتب اسمك الجديد إذا كنت تريد تغييره:", myName);
            if (newName && newName.trim() !== '') {
                myName = newName.trim();
                localStorage.setItem('wt_user_name_v4', myName);
                setupUserPanel();
            }
        }

        function setupUserPanel() {
            document.getElementById('my-5digit-code').innerText = myCode;
            document.getElementById('header-user-name').innerText = myName;

            let lower = myName.toLowerCase();
            if (lower === 'abdo' || lower === 'abpo' || myName === 'عبده') {
                document.getElementById('owner-panel').style.display = 'flex';
                document.getElementById('footer-details').innerHTML = `👑 الحساب الملكي مفعل لـ <b>${myName}</b> | كودك الثابت: ${myCode}`;
            } else {
                document.getElementById('owner-panel').style.display = 'none';
                document.getElementById('footer-details').innerText = `أهلاً بك يا ${myName} | كودك الثابت: ${myCode}`;
            }
        }

        function startCallProcess() {
            let targetCode = document.getElementById('target-code-input').value.trim();

            if (targetCode.length !== 5) {
                alert('يرجى كتابة كود مكون من 5 أرقام بالظبط!');
                return;
            }

            if (targetCode === myCode) {
                alert('هذا هو الكود الخاص بك! اكتب كود صديقك للاتصال به.');
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                document.getElementById('calling-target-text').innerText = `جاري الرن على الرقم (${targetCode})...`;
                document.getElementById('call-screen').style.display = 'flex';
                
                // تشغيل صوت الرنين الحقيقي وإرسال الإشعار الخارجي
                ringToneAudio.play().catch(e => console.log(e));
                sendExternalCallNotification(myName, targetCode);
            })
            .catch(err => {
                alert('يرجى الموافقة على صلاحية الميكروفون لبدء المكالمة اللاسلكية!');
            });
        }

        function endCall() {
            ringToneAudio.pause();
            ringToneAudio.currentTime = 0;
            document.getElementById('call-screen').style.display = 'none';
            document.getElementById('target-code-input').value = '';
        }
    </script>
</body>
</html>
