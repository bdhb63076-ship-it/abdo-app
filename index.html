<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdo Tube - عبده يوتيوب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --secondary-text: #aaaaaa;
            --yt-red: #ff0000;
            --border-color: #272727;
            --card-bg: #212121;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-top: 96px; padding-bottom: 60px; }

        header {
            position: fixed; top: 0; left: 0; right: 0; height: 48px;
            background-color: var(--bg-color); display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000; border-bottom: 1px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: bold; }
        .logo-area i { color: var(--yt-red); font-size: 24px; }

        .feed { display: flex; flex-direction: column; gap: 16px; }
        .video-card { display: flex; flex-direction: column; width: 100%; cursor: pointer; }
        .thumbnail-box { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #1a1a1a; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
        .video-info-box { display: flex; padding: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #444; }
        .video-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .sub-meta { font-size: 12px; color: var(--secondary-text); margin-top: 4px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
            background-color: var(--bg-color); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; font-size: 10px; color: var(--secondary-text); cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; }
        
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="switchTab('home')">
            <i class="fa-brands fa-youtube"></i>
            <span>Abdo Tube</span>
        </div>
        <div>
            <i class="fa-solid fa-crown" style="color:#FFD700; font-size:20px;" onclick="switchTab('profile')"></i>
        </div>
    </header>

    <main>
        <div id="home-page" class="page active">
            <div class="feed" id="video-feed"></div>
        </div>

        <div id="profile-page" class="page" style="padding: 20px; text-align: center;">
            <h1 style="color:#FFD700;"><i class="fa-solid fa-crown"></i> المالك الملكي (Abpo)</h1>
            <p style="margin-top:10px; color:#aaa;">مرحباً بك يا عماد! التطبيق تحت سيطرتك وبدون إعلانات.</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button class="nav-item" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i><span>الملك</span></button>
    </nav>

    <script>
        const API_KEY = 'AIzaSyC80bHi4NQ1cumbNSl8WSe9O47w0_Szw7k';

        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if (tab === 'home') document.getElementById('home-page').classList.add('active');
            if (tab === 'profile') document.getElementById('profile-page').classList.add('active');
        }

        async function fetchVideos() {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=20&regionCode=EG&key=${API_KEY}`;
            try {
                let res = await fetch(url);
                let data = await res.json();
                let feed = document.getElementById('video-feed');
                feed.innerHTML = '';
                data.items.forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="thumbnail-box"><img src="${item.snippet.thumbnails.high.url}"></div>
                        <div class="video-info-box">
                            <img src="${item.snippet.thumbnails.high.url}" class="channel-avatar">
                            <div>
                                <div class="video-title">${item.snippet.title}</div>
                                <div class="sub-meta">${item.snippet.channelTitle}</div>
                            </div>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        window.onload = fetchVideos;
    </script>
</body>
</html>
