
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090e">
<title>الملك لايف | البث المباشر</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg:#07090e;
  --card:#111622;
  --accent:#00e676;
  --gold:#ffd700;
  --border:#1f283d;
  --text:#fff;
}
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,sans-serif;
}
body {
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:14px;
}
header,.owner,.player,.categories,.channels,.footer {
  width:100%;
  max-width:650px;
  margin-left:auto;
  margin-right:auto;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:16px;
  margin-bottom:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
}
.logo {
  color:var(--accent);
  font-weight:bold;
  font-size:17px;
}
#user-label {
  color:var(--accent);
  font-size:12px;
}
.owner {
  display:none;
  text-align:center;
  padding:12px;
  margin-bottom:14px;
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:12px;
}
.player {
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#000;
  border:1px solid var(--border);
  border-radius:15px;
  margin-bottom:15px;
}
.player video,.player iframe {
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}
.status {
  position:absolute;
  bottom:10px;
  right:10px;
  left:10px;
  padding:8px;
  text-align:center;
  background:#111c;
  border-radius:8px;
  font-size:13px;
  pointer-events:none;
}
.categories {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:12px;
}
.cat {
  flex-shrink:0;
  padding:10px 15px;
  background:var(--card);
  color:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  cursor:pointer;
}
.cat.active {
  background:var(--accent);
  color:#000;
}
.channels {
  display:flex;
  flex-direction:column;
  gap:10px;
}
.channel {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  width:100%;
  padding:13px;
  text-align:right;
  color:#fff;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  cursor:pointer;
}
.channel:hover,.channel:focus {
  border-color:var(--accent);
}
.channel-info {
  display:flex;
  align-items:center;
  gap:12px;
}
.channel-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:#1a2235;
  border-radius:10px;
  color:var(--accent);
  font-size:19px;
}
.channel-name {
  font-weight:bold;
}
.channel-cat {
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}
.live {
  color:#ff526c;
  font-size:12px;
  white-space:nowrap;
}
.footer {
  color:#777;
  font-size:12px;
  text-align:center;
  margin-top:22px;
  padding-bottom:12px;
}
.overlay {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#05070cf5;
}
.modal {
  width:100%;
  max-width:380px;
  padding:24px;
  text-align:center;
  background:var(--card);
  border:1px solid var(--accent);
  border-radius:18px;
}
.modal h2,.modal h3 {
  margin-bottom:10px;
}
.modal p {
  color:#bbb;
  font-size:14px;
  margin:12px 0;
}
.modal input {
  width:100%;
  padding:13px;
  margin:10px 0;
  background:#05070c;
  color:white;
  border:1px solid var(--border);
  border-radius:9px;
  font-size:16px;
}
.primary {
  width:100%;
  padding:13px;
  color:#000;
  background:var(--accent);
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}
.ad-modal {
  border-color:var(--gold);
}
.ad-modal h3 {
  color:var(--gold);
}
.timer {
  font-size:28px;
  color:var(--accent);
  margin:16px;
}
.primary:disabled {
  opacity:.5;
  cursor:not-allowed;
}
@media(max-width:360px) {
  body {padding:8px}
  header {padding:12px}
  .channel {padding:10px}
}
</style>
</head>

<body>

<!-- نافذة الدخول -->
<div class="overlay" id="login-modal">
  <div class="modal">
    <h2>📺 الملك لايف</h2>
    <p>اكتب اسمك للدخول إلى المنصة</p>
    <input id="username" maxlength="40"
           placeholder="اسم المشاهد">
    <button class="primary" id="login-btn">
      دخول للمنصة
    </button>
  </div>
</div>

<!-- نافذة الإعلان -->
<div class="overlay" id="ad-modal">
  <div class="modal ad-modal">
    <h3>إعلان تجاري</h3>
    <p>يمكنك متابعة المشاهدة بعد انتهاء العداد.</p>
    <div class="timer" id="ad-timer">05:00</div>
    <button class="primary" id="close-ad" disabled>
      يرجى الانتظار...
    </button>
  </div>
</div>

<header>
  <div class="logo">
    <i class="fa-solid fa-tv"></i>
    الملك لايف
  </div>
  <span id="user-label">زائر</span>
</header>

<div class="owner" id="owner-panel">
  <i class="fa-solid fa-crown"></i>
  المالك: عبده
</div>

<!-- مشغل الفيديو -->
<div class="player" id="player-box">
  <video id="live-player"
         controls
         playsinline
         preload="metadata"></video>
  <div class="status" id="player-status">
    اختر قناة من القائمة لبدء المشاهدة
  </div>
</div>

<!-- تصنيفات القنوات -->
<nav class="categories" aria-label="تصنيفات القنوات">
  <button class="cat active" data-cat="all">الكل</button>
  <button class="cat" data-cat="bein">بي إن سبورت</button>
  <button class="cat" data-cat="egypt">القنوات المصرية</button>
  <button class="cat" data-cat="world">قنوات العالم</button>
  <button class="cat" data-cat="kids">أطفال وكرتون</button>
</nav>

<!-- قائمة القنوات -->
<section class="channels" id="channels-list"></section>

<footer class="footer">
  الملك لايف © 2026 — مصادر البث المرخّصة فقط
</footer>

<!-- مشغل HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script>
'use strict';

/*
  أضف رابط البث المرخص في streamUrl لكل قناة.
  الروابط الفارغة لا تشغّل بثًا فعليًا.
*/
const channels = [
  {
    id:1,
    name:'beIN Sports 1 HD',
    cat:'bein',
    icon:'fa-futbol',
    streamUrl:''
  },
  {
    id:2,
    name:'beIN Sports 2 HD',
    cat:'bein',
    icon:'fa-futbol',
    streamUrl:''
  },
  {
    id:3,
    name:'beIN Sports Premium 1',
    cat:'bein',
    icon:'fa-trophy',
    streamUrl:''
  },
  {
    id:4,
    name:'النهار المصرية',
    cat:'egypt',
    icon:'fa-tv',
    streamUrl:''
  },
  {
    id:5,
    name:'CBC المصرية',
    cat:'egypt',
    icon:'fa-tv',
    streamUrl:''
  },
  {
    id:6,
    name:'أون تايم سبورت',
    cat:'egypt',
    icon:'fa-futbol',
    streamUrl:''
  },
  {
    id:7,
    name:'النيل للأخبار',
    cat:'egypt',
    icon:'fa-newspaper',
    streamUrl:''
  },
  {
    id:8,
    name:'BBC News',
    cat:'world',
    icon:'fa-globe',
    streamUrl:''
  },
  {
    id:9,
    name:'Sky News Arabia',
    cat:'world',
    icon:'fa-satellite-dish',
    streamUrl:''
  },
  {
    id:10,
    name:'سبيستون',
    cat:'kids',
    icon:'fa-child',
    streamUrl:''
  }
];

const $ = id => document.getElementById(id);

const video = $('live-player');
const statusBox = $('player-status');

let hlsInstance = null;
let currentCategory = 'all';
let adInterval = null;
let adTimeout = null;
let adRemaining = 300;
let adVisible = false;

/*
  ملاحظة:
  اسم المالك في المتصفح ليس وسيلة مصادقة آمنة.
  استخدم تحققًا من الخادم لحماية لوحة الإدارة.
*/
function setupUser(name) {
  $('user-label').textContent = name;
  $('owner-panel').style.display =
    name === 'عبده' ? 'block' : 'none';
}

function login() {
  const name =
    $('username').value.trim().slice(0,40) || 'مشاهد';

  localStorage.setItem('tv_user_name', name);
  $('login-modal').style.display = 'none';
  setupUser(name);
}

$('login-btn').addEventListener('click', login);

$('username').addEventListener('keydown', event => {
  if (event.key === 'Enter') login();
});

function renderChannels() {
  const list = $('channels-list');
  list.replaceChildren();

  const filtered = channels.filter(channel =>
    currentCategory === 'all' ||
    channel.cat === currentCategory
  );

  filtered.forEach(channel => {
    const button = document.createElement('button');
    button.className = 'channel';
    button.type = 'button';

    const info = document.createElement('div');
    info.className = 'channel-info';

    const icon = document.createElement('div');
    icon.className = 'channel-icon';

    const iconElement = document.createElement('i');
    iconElement.className = 'fa-solid ' + channel.icon;
    icon.appendChild(iconElement);

    const text = document.createElement('div');

    const name = document.createElement('div');
    name.className = 'channel-name';
    name.textContent = channel.name;

    const category = document.createElement('div');
    category.className = 'channel-cat';
    category.textContent = 'بث مباشر';

    text.append(name, category);
    info.append(icon, text);

    const badge = document.createElement('span');
    badge.className = 'live';
    badge.textContent = '● مباشر';

    button.append(info, badge);
    button.addEventListener('click', () => playChannel(channel));

    list.appendChild(button);
  });

  if (filtered.length === 0) {
    const empty = document.createElement('p');
    empty.textContent = 'لا توجد قنوات في هذا التصنيف.';
    list.appendChild(empty);
  }
}

document.querySelectorAll('.cat').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.cat').forEach(item =>
      item.classList.remove('active')
    );

    button.classList.add('active');
    currentCategory = button.dataset.cat;
    renderChannels();
  });
});

function stopPlayer() {
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  video.pause();
  video.removeAttribute('src');
  video.load();
}

function playChannel(channel) {
  stopPlayer();

  if (!channel.streamUrl) {
    statusBox.textContent =
      'رابط البث غير متوفر لهذه القناة. أضف رابطًا مرخصًا.';
    return;
  }

  let parsedUrl;

  try {
    parsedUrl = new URL(channel.streamUrl);

    if (!['https:', 'http:'].includes(parsedUrl.protocol)) {
      throw new Error('رابط غير صالح');
    }
  } catch {
    statusBox.textContent = 'رابط البث غير صالح.';
    return;
  }

  statusBox.textContent = 'جارٍ تحميل ' + channel.name;

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = parsedUrl.href;
  } else if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls();

    hlsInstance.loadSource(parsedUrl.href);
    hlsInstance.attachMedia(video);

    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      statusBox.textContent = channel.name;
    });

    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        statusBox.textContent =
          'تعذر تشغيل البث. تحقق من الرابط والاتصال.';
      }
    });
  } else {
    statusBox.textContent =
      'المتصفح لا يدعم صيغة البث المطلوبة.';
    return;
  }

  video.play().then(() => {
    statusBox.textContent = channel.name;
  }).catch(() => {
    statusBox.textContent = 'اضغط تشغيل لبدء المشاهدة.';
  });
}

video.addEventListener('error', () => {
  statusBox.textContent =
    'تعذر تحميل الفيديو. تحقق من مصدر البث.';
});

/* نظام الإعلانات */
function showAd() {
  const name = localStorage.getItem('tv_user_name') || '';

  if (name === 'عبده' || adVisible) return;

  adVisible = true;
  adRemaining = 300;

  const modal = $('ad-modal');
  const timer = $('ad-timer');
  const closeButton = $('close-ad');

  clearInterval(adInterval);

  closeButton.disabled = true;
  closeButton.textContent = 'يرجى الانتظار...';
  modal.style.display = 'flex';

  function updateTimer() {
    const minutes = Math.floor(adRemaining / 60);
    const seconds = adRemaining % 60;

    timer.textContent =
      String(minutes).padStart(2,'0') + ':' +
      String(seconds).padStart(2,'0');

    if (adRemaining <= 0) {
      clearInterval(adInterval);
      closeButton.disabled = false;
      closeButton.textContent = 'متابعة المشاهدة';
      return;
    }

    adRemaining--;
  }

  updateTimer();
  adInterval = setInterval(updateTimer, 1000);
}

$('close-ad').addEventListener('click', () => {
  if ($('close-ad').disabled) return;

  $('ad-modal').style.display = 'none';
  adVisible = false;
  clearInterval(adInterval);
  scheduleAd();
});

function scheduleAd() {
  clearTimeout(adTimeout);

  const name = localStorage.getItem('tv_user_name') || '';
  if (name === 'عبده') return;

  adTimeout = setTimeout(() => {
    showAd();
  }, 60 * 60 * 1000);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedName = localStorage.getItem('tv_user_name');

  if (savedName) {
    setupUser(savedName);
  } else {
    $('login-modal').style.display = 'flex';
  }

  renderChannels();
  scheduleAd();
});

window.addEventListener('beforeunload', () => {
  clearInterval(adInterval);
  clearTimeout(adTimeout);

  if (hlsInstance) {
    hlsInstance.destroy();
  }
});
</script>

</body>
</html>
