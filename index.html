
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>عبده تيوب | Abdo Tube</title>
  <style>
    :root {
      --bg: #101116;
      --panel: #191a22;
      --panel2: #22232d;
      --text: #f8f8fb;
      --muted: #a6a7b5;
      --red: #ff3048;
      --border: #30313c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4%;
      background: rgba(16,17,22,.97);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      font-size: 22px;
      font-weight: bold;
    }

    .brand-icon {
      background: var(--red);
      color: white;
      border-radius: 10px;
      padding: 6px 10px;
    }

    .brand span:last-child { color: var(--red); }

    .search {
      display: flex;
      gap: 8px;
      width: min(600px, 100%);
      margin: auto;
    }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--panel);
      color: white;
      outline: none;
    }

    .search input:focus { border-color: var(--red); }

    .btn {
      border: 0;
      border-radius: 22px;
      padding: 11px 17px;
      background: var(--red);
      color: white;
      font-weight: bold;
    }

    .btn.secondary {
      background: var(--panel2);
      border: 1px solid var(--border);
    }

    .layout {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 22px;
      max-width: 1600px;
      margin: auto;
      padding: 22px 3%;
    }

    aside {
      position: sticky;
      top: 85px;
      align-self: start;
    }

    .nav-item {
      width: 100%;
      display: block;
      text-align: right;
      padding: 14px;
      margin-bottom: 7px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 10px;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--panel2);
    }

    .nav-item.active { color: #ff5367; }

    main { min-width: 0; }

    .hero {
      padding: 26px;
      border: 1px solid #39303a;
      border-radius: 18px;
      background: linear-gradient(120deg, #35151f, #211c2b 60%, #191a22);
      margin-bottom: 25px;
    }

    .hero h1 { margin: 0 0 10px; font-size: 27px; }
    .hero p { color: #d2cbd2; line-height: 1.8; margin: 0 0 17px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 0 15px;
    }

    .section-head h2 { font-size: 20px; margin: 0; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 15px;
      color: white;
      background: var(--panel);
    }

    .chip:hover, .chip.active {
      background: var(--red);
      border-color: var(--red);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px 15px;
    }

    .video-card {
      min-width: 0;
      overflow: hidden;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 13px;
      cursor: pointer;
    }

    .video-card:hover {
      background: var(--panel);
      border-color: var(--border);
    }

    .thumbnail {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--panel2);
      overflow: hidden;
      border-radius: 12px;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-icon {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 40px;
      color: white;
      text-shadow: 0 2px 8px #000;
      opacity: .9;
    }

    .video-info { padding: 11px 3px; }

    .video-title {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .channel {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      color: var(--muted);
      line-height: 1.9;
      padding: 20px 5px;
    }

    .error { color: #ff8b98; }
    .hidden { display: none !important; }

    .live-label {
      position: absolute;
      top: 9px;
      right: 9px;
      padding: 5px 8px;
      background: #e90025;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
    }

    .footer {
      padding: 25px 10px;
      margin-top: 35px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
      font-size: 13px;
    }

    /* نافذة مشاهدة الفيديو */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow-y: auto;
      padding: 18px;
      background: rgba(0,0,0,.88);
      align-items: center;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      width: min(950px, 100%);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 15px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .modal-head h2 {
      font-size: 17px;
      line-height: 1.7;
      margin: 0;
    }

    .close-btn {
      border: 0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      color: white;
      background: #33343e;
      font-size: 23px;
    }

    #youtube-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    #youtube-player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .watch-details {
      padding: 13px 2px;
      color: var(--muted);
      line-height: 1.9;
    }

    .watch-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 10px;
    }

    @media (max-width: 1050px) {
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout { grid-template-columns: 165px minmax(0, 1fr); }
    }

    @media (max-width: 650px) {
      .topbar { flex-wrap: wrap; padding: 12px; }
      .brand { font-size: 19px; }
      .search { order: 2; flex-basis: 100%; }
      .layout { display: block; padding: 15px 12px; }
      aside {
        position: static;
        display: flex;
        gap: 5px;
        overflow-x: auto;
        margin-bottom: 17px;
      }
      .nav-item {
        width: auto;
        white-space: nowrap;
        padding: 11px 13px;
      }
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 9px; }
      .hero { padding: 20px; }
      .hero h1 { font-size: 23px; }
      .video-title { font-size: 13px; }
      .modal { padding: 8px; }
      .modal-content { padding: 10px; }
    }

    @media (max-width: 360px) {
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">▶</span>
      <span>عبده <span>تيوب</span></span>
    </div>

    <form class="search" id="search-form">
      <input
        id="search-input"
        type="search"
        placeholder="ابحث عن فيديوهات يوتيوب..."
        aria-label="البحث عن فيديوهات"
      >
      <button class="btn" type="submit">بحث</button>
    </form>
  </header>

  <div class="layout">
    <aside>
      <button class="nav-item active" data-section="home">🏠 الرئيسية</button>
      <button class="nav-item" data-section="popular">🔥 الأكثر مشاهدة</button>
      <button class="nav-item" data-section="live">🔴 البث المباشر</button>
      <button class="nav-item" data-section="search">🔎 البحث</button>
    </aside>

    <main>
      <section class="hero">
        <h1>أهلاً بك في عبده تيوب 👑</h1>
        <p>
          شاهد فيديوهات يوتيوب وابحث عن المحتوى الذي تحبه،
          وشغّل الفيديو داخل الموقع.
        </p>
        <button class="btn" id="explore-btn">اكتشف الفيديوهات</button>
      </section>

      <div class="chips" id="category-chips">
        <button class="chip active" data-query="">الكل</button>
        <button class="chip" data-query="أفلام وثائقية">وثائقيات</button>
        <button class="chip" data-query="تقنية">تقنية</button>
        <button class="chip" data-query="رياضة">رياضة</button>
        <button class="chip" data-query="ألعاب">ألعاب</button>
        <button class="chip" data-query="تعليم">تعليم</button>
        <button class="chip" data-query="موسيقى">موسيقى</button>
      </div>

      <div class="section-head">
        <h2 id="section-title">فيديوهات مقترحة</h2>
        <button class="btn secondary" id="refresh-btn">تحديث</button>
      </div>

      <div id="status" class="status" role="status">
        جارٍ تجهيز الفيديوهات...
      </div>

      <div id="video-grid" class="video-grid"></div>

      <div class="footer">
        <div>© <span id="year"></span> عبده تيوب — Abdo Tube</div>
        <div>الفيديوهات مستضافة على يوتيوب وتخضع لشروطه وإعدادات أصحابها.</div>
      </div>
    </main>
  </div>

  <div class="modal" id="watch-modal" role="dialog" aria-modal="true"
       aria-labelledby="watch-title">
    <div class="modal-content">
      <div class="modal-head">
        <h2 id="watch-title">مشاهدة الفيديو</h2>
        <button class="close-btn" id="close-watch" aria-label="إغلاق">×</button>
      </div>

      <div id="youtube-player"></div>

      <div class="watch-details">
        <div id="watch-channel">يوتيوب</div>
        <div id="watch-message"></div>
        <div class="watch-actions">
          <button class="btn secondary" id="open-youtube">فتح على يوتيوب</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    /*
      1) ضع مفتاح YouTube Data API v3 مكان النص أدناه.
      2) لا تضع رابط iframe_api مكان المفتاح.
      3) قيّد المفتاح من Google Cloud Console على API المناسبة.
    */
    const YOUTUBE_API_KEY = "ضع_مفتاح_YouTube_Data_API_v3_هنا";

    const API_BASE = "https://www.googleapis.com/youtube/v3";
    const SAMPLE_VIDEOS = [
      {
        id: "M7lc1UVf-VE",
        title: "فيديو تجريبي لمشغل يوتيوب",
        channel: "YouTube Developers"
      }
    ];

    const $ = (id) => document.getElementById(id);

    let videos = [];
    let player = null;
    let apiReady = false;
    let selectedVideo = null;
    let currentRequest = 0;

    $("year").textContent = new Date().getFullYear();

    // تحميل مشغل يوتيوب الرسمي
    (function loadYouTubePlayerAPI() {
      if (window.YT && window.YT.Player) {
        apiReady = true;
        return;
      }

      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      script.onerror = function () {
        $("status").textContent =
          "تعذر تحميل مشغل يوتيوب. تحقق من اتصال الإنترنت.";
        $("status").classList.add("error");
      };

      document.head.appendChild(script);
    })();

    // يستدعي يوتيوب هذه الدالة عند تحميل واجهة المشغل
    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
    };

    function showStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").classList.toggle("error", isError);
      $("status").classList.remove("hidden");
    }

    function hideStatus() {
      $("status").classList.add("hidden");
    }

    function safeVideoId(id) {
      return typeof id === "string" && /^[a-zA-Z0-9_-]{11}$/.test(id);
    }

    function escapeText(value) {
      return String(value || "");
    }

    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "video-card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "تشغيل: " + video.title);

      const thumbnail = document.createElement("div");
      thumbnail.className = "thumbnail";

      const image = document.createElement("img");
      image.src = "https://i.ytimg.com/vi/" +
        encodeURIComponent(video.id) + "/hqdefault.jpg";
      image.alt = video.title;
      image.loading = "lazy";
      image.onerror = function () {
        image.style.display = "none";
      };

      const play = document.createElement("div");
      play.className = "play-icon";
      play.textContent = "▶";

      thumbnail.append(image, play);

      const info = document.createElement("div");
      info.className = "video-info";

      const title = document.createElement("div");
      title.className = "video-title";
      title.textContent = escapeText(video.title);

      const channel = document.createElement("div");
      channel.className = "channel";
      channel.textContent = escapeText(video.channel || "YouTube");

      info.append(title, channel);
      card.append(thumbnail, info);

      card.addEventListener("click", () => openWatch(video));
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openWatch(video);
        }
      });

      return card;
    }

    function renderVideos(items) {
      const grid = $("video-grid");
      grid.replaceChildren();

      const validVideos = items.filter((video) => safeVideoId(video.id));

      if (!validVideos.length) {
        showStatus("لم يتم العثور على فيديوهات. جرّب بحثًا آخر.");
        return;
      }

      hideStatus();

      const fragment = document.createDocumentFragment();
      validVideos.forEach((video) => fragment.appendChild(createVideoCard(video)));
      grid.appendChild(fragment);
    }

    function showSamples() {
      videos = SAMPLE_VIDEOS.slice();
      renderVideos(videos);
      showStatus(
        "هذه بطاقة تجريبية للتأكد من عمل الصفحة. أضف مفتاح YouTube Data API v3 لعرض نتائج البحث والفيديوهات الفعلية."
      );
    }

    async function youtubeRequest(endpoint, params) {
      if (
        !YOUTUBE_API_KEY ||
        YOUTUBE_API_KEY === "ضع_مفتاح_YouTube_Data_API_v3_هنا"
      ) {
        throw new Error("MISSING_API_KEY");
      }

      const url = new URL(API_BASE + "/" + endpoint);
      Object.entries({ ...params, key: YOUTUBE_API_KEY }).forEach(
        ([key, value]) => url.searchParams.set(key, String(value))
      );

      const response = await fetch(url.toString());
      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("تعذر قراءة استجابة يوتيوب.");
      }

      if (!response.ok) {
        const reason = data?.error?.errors?.[0]?.reason || "";
        const message = data?.error?.message || "حدث خطأ في طلب يوتيوب.";

        if (reason === "quotaExceeded") {
          throw new Error("انتهت الحصة اليومية لطلبات YouTube API.");
        }

        if (
          reason === "keyInvalid" ||
          reason === "accessNotConfigured" ||
          response.status === 403
        ) {
          throw new Error(
            "تحقق من مفتاح API وتفعيل YouTube Data API v3 والحصة المسموحة."
          );
        }

        throw new Error(message);
      }

      return data;
    }

    async function searchVideos(query = "") {
      const requestId = ++currentRequest;
      $("section-title").textContent = query
        ? "نتائج البحث: " + query
        : "فيديوهات مقترحة";

      showStatus("جارٍ تحميل الفيديوهات...");
      $("video-grid").replaceChildren();

      try {
        const data = await youtubeRequest("search", {
          part: "snippet",
          type: "video",
          maxResults: 24,
          q: query || "فيديوهات عربية متنوعة",
          safeSearch: "moderate",
          relevanceLanguage: "ar"
        });

        if (requestId !== currentRequest) return;

        videos = (data.items || [])
          .filter((item) => item.id && safeVideoId(item.id.videoId))
          .map((item) => ({
            id: item.id.videoId,
            title: item.snippet?.title || "فيديو يوتيوب",
            channel: item.snippet?.channelTitle || "YouTube"
          }));

        renderVideos(videos);
      } catch (error) {
        if (requestId !== currentRequest) return;

        if (error.message === "MISSING_API_KEY") {
          showSamples();
        } else {
          showStatus(error.message, true);
        }
      }
    }

    async function loadPopularVideos() {
      const requestId = ++currentRequest;
      $("section-title").textContent = "الأكثر مشاهدة";
      showStatus("جارٍ تحميل الفيديوهات الأكثر مشاهدة...");
      $("video-grid").replaceChildren();

      try {
        const data = await youtubeRequest("videos", {
          part: "snippet,statistics",
          chart: "mostPopular",
          regionCode: "EG",
          maxResults: 24
        });

        if (requestId !== currentRequest) return;

        videos = (data.items || [])
          .filter((item) => safeVideoId(item.id))
          .map((item) => ({
            id: item.id,
            title: item.snippet?.title || "فيديو يوتيوب",
            channel: item.snippet?.channelTitle || "YouTube"
          }));

        renderVideos(videos);
      } catch (error) {
        if (requestId !== currentRequest) return;
        showStatus(
          error.message === "MISSING_API_KEY"
            ? "أضف مفتاح API لعرض الفيديوهات الأكثر مشاهدة."
            : error.message,
          true
        );
      }
    }

    async function loadLiveVideos() {
      const requestId = ++currentRequest;
      $("section-title").textContent = "البث المباشر";
      showStatus("جارٍ البحث عن بث مباشر متاح...");
      $("video-grid").replaceChildren();

      try {
        const data = await youtubeRequest("search", {
          part: "snippet",
          type: "video",
          eventType: "live",
          maxResults: 24,
          q: "بث مباشر",
          relevanceLanguage: "ar"
        });

        if (requestId !== currentRequest) return;

        videos = (data.items || [])
          .filter((item) => item.id && safeVideoId(item.id.videoId))
          .map((item) => ({
            id: item.id.videoId,
            title: item.snippet?.title || "بث مباشر",
            channel: item.snippet?.channelTitle || "YouTube",
            live: true
          }));

        renderVideos(videos);

        if (videos.length) {
          document.querySelectorAll(".video-card").forEach((card) => {
            const label = document.createElement("span");
            label.className = "live-label";
            label.textContent = "مباشر";
            card.querySelector(".thumbnail").appendChild(label);
          });
        }
      } catch (error) {
        if (requestId !== currentRequest) return;
        showStatus(
          error.message === "MISSING_API_KEY"
            ? "أضف مفتاح API للبحث عن البثوث المباشرة."
            : error.message,
          true
        );
      }
    }

    function openWatch(video) {
      if (!safeVideoId(video.id)) {
        showStatus("معرّف فيديو يوتيوب غير صحيح.", true);
        return;
      }

      selectedVideo = video;
      $("watch-title").textContent = video.title;
      $("watch-channel").textContent = video.channel || "YouTube";
      $("watch-message").textContent = "";
      $("watch-modal").classList.add("open");
      document.body.style.overflow = "hidden";

      $("open-youtube").onclick = function () {
        window.open(
          "https://www.youtube.com/watch?v=" + encodeURIComponent(video.id),
          "_blank",
          "noopener,noreferrer"
        );
      };

      // ننتظر تحميل واجهة يوتيوب قبل إنشاء المشغل
      const startTime = Date.now();

      function tryCreatePlayer() {
        if (!$("watch-modal").classList.contains("open")) return;

        if (window.YT && window.YT.Player) {
          apiReady = true;

          if (player && typeof player.loadVideoById === "function") {
            player.loadVideoById(video.id);
          } else {
            player = new YT.Player("youtube-player", {
              width: "100%",
              height: "100%",
              videoId: video.id,
              playerVars: {
                autoplay: 1,
                playsinline: 1,
                rel: 0
              },
              events: {
                onError: function (event) {
                  const messages = {
                    2: "معرّف الفيديو غير صحيح.",
                    5: "حدثت مشكلة في مشغل HTML5.",
                    100: "الفيديو غير موجود أو تمت إزالته.",
                    101: "صاحب الفيديو لا يسمح بتضمينه في مواقع أخرى.",
                    150: "صاحب الفيديو لا يسمح بتضمينه في مواقع أخرى."
                  };

                  $("watch-message").textContent =
                    messages[event.data] ||
                    "تعذر تشغيل الفيديو داخل الموقع. جرّب فتحه على يوتيوب.";
                }
              }
            });
          }

          return;
        }

        if (Date.now() - startTime < 10000) {
          window.setTimeout(tryCreatePlayer, 200);
        } else {
          $("watch-message").textContent =
            "مشغل يوتيوب لم يتم تحميله. تحقق من الإنترنت أو افتح الفيديو على يوتيوب.";
        }
      }

      tryCreatePlayer();
    }

    function closeWatch() {
      $("watch-modal").classList.remove("open");
      document.body.style.overflow = "";

      if (player && typeof player.stopVideo === "function") {
        player.stopVideo();
      }
    }

    $("close-watch").addEventListener("click", closeWatch);

    $("watch-modal").addEventListener("click", function (event) {
      if (event.target === $("watch-modal")) closeWatch();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeWatch();
    });

    $("search-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const query = $("search-input").value.trim();

      if (!query) {
        $("search-input").focus();
        return;
      }

      document.querySelectorAll(".nav-item").forEach((button) => {
        button.classList.toggle("active", button.dataset.section === "search");
      });

      searchVideos(query);
    });

    $("category-chips").addEventListener("click", function (event) {
      const button = event.target.closest("button[data-query]");
      if (!button) return;

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.classList.toggle("active", chip === button);
      });

      $("search-input").value = button.dataset.query;
      searchVideos(button.dataset.query);
    });

    document.querySelectorAll(".nav-item").forEach((button) => {
      button.addEventListener("click", function () {
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.toggle("active", item === button);
        });

        const section = button.dataset.section;

        if (section === "home") {
          $("search-input").value = "";
          searchVideos("");
        } else if (section === "popular") {
          loadPopularVideos();
        } else if (section === "live") {
          loadLiveVideos();
        } else if (section === "search") {
          $("search-input").focus();
          showStatus("اكتب اسم الفيديو في مربع البحث بالأعلى.");
        }
      });
    });

    $("explore-btn").addEventListener("click", function () {
      $("search-input").value = "";
      searchVideos("");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $("refresh-btn").addEventListener("click", function () {
      const active = document.querySelector(".nav-item.active");
      const section = active ? active.dataset.section : "home";

      if (section === "popular") loadPopularVideos();
      else if (section === "live") loadLiveVideos();
      else searchVideos($("search-input").value.trim());
    });

    // اعرض بطاقة تجريبية فور فتح الصفحة؛ لا تحتاج API key.
    showSamples();
  </script>
</body>
</html>
