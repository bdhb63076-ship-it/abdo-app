<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kings League Tournament 3D</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Arial', sans-serif; }
  #canvas-container { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

  /* تنبيه التدوير */
  #rotate-notice { position: fixed; inset: 0; background: #000; z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; color: #ffd700; font-size: 18px; font-weight: bold; text-align: center; padding: 20px; }

  /* شاشة القائمة واختيار البطولة */
  .screen { position: absolute; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
  .hidden { display: none !important; }

  h1 { color: #ffd700; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 10px #ffd700; }
  h3 { color: #ff0055; margin-bottom: 20px; }

  .btn { background: linear-gradient(135deg, #ffd700, #ff8800); color: #000; border: 0; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(255,215,0,0.5); margin: 5px; }

  /* واجهة النتيجة والبطولة */
  .hud-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
  .stage-badge { background: #ff0055; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 10px; border-radius: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .score-board { display: flex; align-items: center; background: rgba(0, 0, 0, 0.9); border: 2px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.9); }
  
  .team-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-weight: bold; font-size: 13px; }
  .team-bar.t1 { background: linear-gradient(90deg, #111, #222); color: #00ffcc; border-left: 3px solid #00ffcc; }
  .team-bar.t2 { background: linear-gradient(90deg, #222, #111); color: #ff0055; border-right: 3px solid #ff0055; }
  .score-box { background: #000; color: #fff; padding: 6px 16px; font-size: 18px; font-weight: 900; border-left: 1px solid #333; border-right: 1px solid #333; text-align: center; }

  /* التحكم */
  .joystick-zone { position: absolute; bottom: 20px; left: 25px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; z-index: 10; }
  .joystick-stick { position: absolute; width: 50px; height: 50px; background: radial-gradient(circle, #ffd700, #ff8800); border-radius: 50%; top: 35px; left: 35px; box-shadow: 0 0 15px rgba(255,215,0,0.6); pointer-events: none; }

  .action-buttons { position: absolute; bottom: 20px; right: 25px; width: 150px; height: 150px; z-index: 10; }
  .act-btn { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); cursor: pointer; }
  .act-btn span:first-child { font-size: 15px; }
  .act-btn.pass { bottom: 0; left: 0; background: rgba(0, 150, 255, 0.4); border-color: #0096ff; }
  .act-btn.cross { top: 0; right: 40px; background: rgba(255, 170, 0, 0.4); border-color: #ffaa00; }
  .act-btn.shoot { bottom: 40px; right: 0; background: rgba(255, 0, 85, 0.5); border-color: #ff0055; width: 65px; height: 65px; }
  .act-btn.press { top: 40px; left: 0; background: rgba(40, 200, 80, 0.4); border-color: #28c850; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="rotate-notice">🔄 يرجى تدوير الهاتف للوضع الأفقي (Landscape)</div>

<!-- القائمة الرئيسية ونظام البطولة -->
<div id="menu-screen" class="screen">
  <h1>🏆 بطولة كينجز ليج 3D</h1>
  <h3>KINGS LEAGUE TOURNAMENT</h3>
  <button class="btn" onclick="startTournament()">بدء البطولة ⚽</button>
</div>

<!-- واجهة المباراة -->
<div id="game-ui" class="hidden">
  <div class="hud-top">
    <div class="stage-badge" id="tournament-stage">دور المجموعات - المباراة 1</div>
    <div class="score-board">
      <div class="team-bar t1"><span>🇶🇦 ABO FC</span></div>
      <div class="score-box"><span id="score1">0</span> - <span id="score2">0</span></div>
      <div class="team-bar t2"><span id="opp-name">3BS FC</span></div>
    </div>
  </div>

  <div class="joystick-zone" id="joy-zone"><div class="joystick-stick" id="joy-stick"></div></div>

  <div class="action-buttons">
    <button class="act-btn pass" id="btn-pass"><span>🎯</span><span>باص</span></button>
    <button class="act-btn cross" id="btn-cross"><span>🚀</span><span>عرضية</span></button>
    <button class="act-btn shoot" id="btn-shoot"><span>💥</span><span>تسديد</span></button>
    <button class="act-btn press" id="btn-press"><span>🛡️</span><span>قطع</span></button>
  </div>
</div>

<div id="canvas-container"></div>

<script>
const $ = id => document.getElementById(id);

let currentStageIndex = 0;
const tournamentStages = [
  { name: "دور المجموعات", opp: "3BS FC 🇯🇴" },
  { name: "نصف النهائي", opp: "TURBON FC 🇪🇸" },
  { name: "النهائي الكبير 🏆", opp: "AGUERO KING 🇦🇷" }
];

function checkOrientation() {
  $('rotate-notice').style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('load', checkOrientation);

let scene, camera, renderer, playerMesh, aiMesh, ballMesh;
let joyVector = { x: 0, y: 0 };
let ballVelocity = new THREE.Vector3(0, 0, 0);
let score1 = 0, score2 = 0;

function startTournament() {
  $('menu-screen').classList.add('hidden');$('game-ui').classList.remove('hidden');
  loadStage();
  init3D();
  setupJoystick();
  setupActions();
  animate();
}

function loadStage() {
  let stage = tournamentStages[currentStageIndex];
  $('tournament-stage').textContent = stage.name;
  $('opp-name').textContent = stage.opp;
  score1 = 0; score2 = 0;
  $('score1').textContent = "0";
  $('score2').textContent = "0";
}

function init3D() {
  const container = $('canvas-container');
  if (renderer) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050508);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 32, 38);
  camera.lookAt(0, 0, -2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const light1 = new THREE.SpotLight(0x00aaff, 1.5);
  light1.position.set(-20, 40, 20);
  scene.add(light1);

  const light2 = new THREE.SpotLight(0xff0055, 1.5);
  light2.position.set(20, 40, -20);
  scene.add(light2);

  const pitchGeo = new THREE.PlaneGeometry(64, 40);
  const pitchMat = new THREE.MeshStandardMaterial({ color: 0x121215, roughness: 0.8 });
  const pitch = new THREE.Mesh(pitchGeo, pitchMat);
  pitch.rotation.x = -Math.PI / 2;
  scene.add(pitch);

  const linesGeo = new THREE.PlaneGeometry(60, 36);
  const linesMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
  const lines = new THREE.Mesh(linesGeo, linesMat);
  lines.rotation.x = -Math.PI / 2;
  lines.position.y = 0.01;
  scene.add(lines);

  const playerGeo = new THREE.CapsuleGeometry(0.8, 1.5, 8, 16);
  const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3 });
  playerMesh = new THREE.Mesh(playerGeo, playerMat);
  playerMesh.position.set(-8, 1.55, 0);
  scene.add(playerMesh);

  const aiMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
  aiMesh = new THREE.Mesh(playerGeo, aiMat);
  aiMesh.position.set(8, 1.55, 0);
  scene.add(aiMesh);

  const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  ballMesh = new THREE.Mesh(ballGeo, ballMat);
  ballMesh.position.set(0, 0.5, 0);
  scene.add(ballMesh);
}

function setupJoystick() {
  const zone = $('joy-zone'), stick =$('joy-stick');
  let activeTouchId = null;

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    let t = e.changedTouches[0];
    activeTouchId = t.identifier;
    updateStick(t);
  });

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      if (t.identifier === activeTouchId) updateStick(t);
    }
  });

  const resetStick = e => {
    for (let t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        activeTouchId = null;
        stick.style.transform = `translate(0px, 0px)`;
        joyVector = { x: 0, y: 0 };
      }
    }
  };
  zone.addEventListener('touchend', resetStick);
  zone.addEventListener('touchcancel', resetStick);

  function updateStick(t) {
    let rect = zone.getBoundingClientRect();
    let dx = t.clientX - (rect.left + rect.width / 2);
    let dy = t.clientY - (rect.top + rect.height / 2);
    let dist = Math.hypot(dx, dy);
    let maxR = 35;

    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector.x = dx / maxR;
    joyVector.y = dy / maxR;
  }
}

function setupActions() {
  $('btn-shoot').addEventListener('touchstart', () => kickBall(16, 4));$('btn-pass').addEventListener('touchstart', () => kickBall(9, 0));
  $('btn-cross').addEventListener('touchstart', () => kickBall(11, 6));$('btn-press').addEventListener('touchstart', () => {
    playerMesh.position.x += (ballMesh.position.x - playerMesh.position.x) * 0.35;
    playerMesh.position.z += (ballMesh.position.z - playerMesh.position.z) * 0.35;
  });
}

function kickBall(speed, upPower) {
  let dist = playerMesh.position.distanceTo(ballMesh.position);
  if (dist < 2.5) {
    let dir = new THREE.Vector3().subVectors(ballMesh.position, playerMesh.position).normalize();
    if (dir.length() === 0) dir.set(1, 0, 0);
    ballVelocity.x = dir.x * speed;
    ballVelocity.z = dir.z * speed;
    ballVelocity.y = upPower;
  }
}

function animate() {
  requestAnimationFrame(animate);

  playerMesh.position.x += joyVector.x * 0.25;
  playerMesh.position.z += joyVector.y * 0.25;

  playerMesh.position.x = Math.max(-28, Math.min(28, playerMesh.position.x));
  playerMesh.position.z = Math.max(-16, Math.min(16, playerMesh.position.z));

  ballMesh.position.addScaledVector(ballVelocity, 0.05);
  ballVelocity.multiplyScalar(0.95);

  if (ballMesh.position.y > 0.5) {
    ballVelocity.y -= 0.3;
  } else {
    ballMesh.position.y = 0.5;
    ballVelocity.y = 0;
  }

  aiMesh.position.x += (ballMesh.position.x - aiMesh.position.x) * 0.03;
  aiMesh.position.z += (ballMesh.position.z - aiMesh.position.z) * 0.03;

  // تسجيل الأهداف والتقدم في البطولة
  if (ballMesh.position.x > 29) {
    score1++;
    $('score1').textContent = score1;
    resetBall();
    if (score1 >= 2) {
      alert("مبروك! تأهلت للمرحلة القادمة في البطولة 🎉");
      currentStageIndex++;
      if (currentStageIndex < tournamentStages.length) {
        loadStage();
      } else {
        alert("🏆 مبروك يا عبده! بطل كينجز ليج 3D!");
        currentStageIndex = 0;
        loadStage();
      }
    }
  } else if (ballMesh.position.x < -29) {
    score2++;
    $('score2').textContent = score2;
    resetBall();
  }

  renderer.render(scene, camera);
}

function resetBall() {
  ballMesh.position.set(0, 0.5, 0);
  ballVelocity.set(0,0,0);
  playerMesh.position.set(-8, 1.55, 0);
  aiMesh.position.set(8, 1.55, 0);
}
</script>
</body>
</html>
