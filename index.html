<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Tube - يوتيوب المصغر</title>
    <!-- استيراد أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --secondary-bg: #212121;
            --accent-color: #ff0000;
            --border-color: #3f3f3f;
            --gray-text: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* شريط التنقل العلوي */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
        }

        .logo-area i {
            color: var(--accent-color);
            font-size: 24px;
        }

        .search-area {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 600px;
            margin: 0 20px;
        }

        .search-area input {
            width: 100%;
            height: 40px;
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 20px 0 0 20px;
            padding: 0 16px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-area button {
            height: 40px;
            padding: 0 20px;
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-left: none;
            border-radius: 0 20px 20px 0;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
        }

        .user-profile-icon {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
        }

        /* الأقسام والمحتوى */
        main {
            margin-top: 70px;
            padding: 16px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* شبكة الفيديوهات */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .video-card {
            background-color: var(--bg-color);
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: var(--secondary-bg);
            object-fit: cover;
            border-radius: 12px;
        }

        .video-info {
            display: flex;
            gap: 12px;
            padding-top: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #555;
            object-fit: cover;
        }

        .video-details h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details p {
            font-size: 12px;
            color: var(--gray-text);
        }

        /* شريط التنقل السفلي */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--gray-text);
            cursor: pointer;
            font-size: 11px;
            gap: 4px;
            background: none;
            border: none;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--text-color);
        }

        /* صفحة العرض والفيديو */
        #watch-view {
            position: fixed;
            top: 56px;
            left: 0;
            width: 100%;
            height: calc(100vh - 56px);
            background-color: var(--bg-color);
            z-index: 2000;
            display: none;
            overflow-y: auto;
            padding: 16px;
        }

        .video-player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo-area" onclick="switchPage('home')">
            <i class="fa-brands.fa-youtube"></i> Abdo Tube
        </div>
        <div class="search-area">
            <input type="text" id="search-input" placeholder="بحث...">
            <button onclick="searchVideos()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="user-profile-icon" onclick="switchPage('profile')">
            <i class="fa-solid fa-circle-user"></i>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- صفحة الرئيسية -->
        <div id="home-page" class="page active">
            <div id="video-feed" class="video-grid">
                <!-- الفيديوهات ستظهر هنا تلقائياً -->
            </div>
        </div>

        <!-- صفحة Shorts -->
        <div id="shorts-page" class="page">
            <h2>قسم Shorts قريباً...</h2>
        </div>

        <!-- صفحة رفع فيديو محلي -->
        <div id="upload-page" class="page">
            <h2>رفع فيديو محلي</h2>
            <input type="file" id="local-video-file" accept="video/*" style="margin-top: 15px;">
        </div>

        <!-- صفحة الاشتراكات -->
        <div id="subscriptions-page" class="page">
            <h2>الاشتراكات</h2>
        </div>

        <!-- صفحة الحساب / أنت -->
        <div id="profile-page" class="page">
            <h2>حسابي (Abdo)</h2>
            <p>إحصائيات قناتك والفيديوهات المرفوعة ستظهر هنا.</p>
        </div>
    </main>

    <!-- شاشة تشغيل الفيديو الفردي -->
    <div id="watch-view">
        <button onclick="closeWatchView()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer; margin-bottom:10px;">
            <i class="fa-solid fa-arrow-right"></i> رجوع
        </button>
        <div class="video-player-container">
            <iframe id="youtube-player" src="" allowfullscreen></iframe>
        </div>
        <h2 id="watch-title" style="margin-top: 15px; font-size: 16px;"></h2>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home')">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchPage('shorts')">
            <i class="fa-solid fa-bolt"></i>
            <span>Shorts</span>
        </button>
        <button class="nav-item" onclick="switchPage('upload')">
            <i class="fa-solid fa-circle-plus" style="font-size: 26px; color: var(--accent-color);"></i>
            <span>إنشاء</span>
        </button>
        <button class="nav-item" onclick="switchPage('subscriptions')">
            <i class="fa-solid fa-clone"></i>
            <span>الاشتراكات</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile')">
            <i class="fa-solid fa-user"></i>
            <span>أنت</span>
        </button>
    </nav>

    <!-- البرمجة وجلب فيديوهات يوتيوب الحقيقية -->
    <script>
        // مفتاح الـ API الخاص بك الذي تم استخراجه من جوجل
        const API_KEY = 'AIzaSyC80bHi4NQ1cumbNSl8WSe9O47w0_Szw7k';

        // التنقل بين الصفحات
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));

            if(pageName === 'home') {
                document.getElementById('home-page').classList.add('active');
            } else if(pageName === 'shorts') {
                document.getElementById('shorts-page').classList.add('active');
            } else if(pageName === 'upload') {
                document.getElementById('upload-page').classList.add('active');
            } else if(pageName === 'subscriptions') {
                document.getElementById('subscriptions-page').classList.add('active');
            } else if(pageName === 'profile') {
                document.getElementById('profile-page').classList.add('active');
            }
        }

        // جلب الفيديوهات الرائجة عند فتح الموقع
        async function fetchTrendingVideos() {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=20&regionCode=EG&key=${API_KEY}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                displayVideos(data.items);
            } catch (error) {
                console.error("خطأ في جلب الفيديوهات:", error);
            }
        }

        // البحث الحقيقي في يوتيوب
        async function searchVideos() {
            let query = document.getElementById('search-input').value;
            if(!query) return;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                displayVideos(data.items);
            } catch (error) {
                console.error("خطأ في البحث:", error);
            }
        }

        // عرض الفيديوهات في الشاشة الرئيسية
        function displayVideos(videos) {
            let feed = document.getElementById('video-feed');
            feed.innerHTML = '';
            
            videos.forEach(video => {
                let videoId = video.id.videoId || video.id;
                let title = video.snippet.title;
                let channelTitle = video.snippet.channelTitle;
                let thumbnail = video.snippet.thumbnails.medium.url;

                let card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img class="thumbnail" src="${thumbnail}" alt="video">
                    <div class="video-info">
                        <div class="video-details">
                            <h3>${title}</h3>
                            <p>${channelTitle}</p>
                        </div>
                    </div>
                `;
                card.onclick = () => openVideo(videoId, title);
                feed.appendChild(card);
            });
        }

        // فتح وتشغيل الفيديو داخل التطبيق
        function openVideo(videoId, title) {
            document.getElementById('youtube-player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('watch-title').innerText = title;
            document.getElementById('watch-view').style.display = 'block';
        }

        // إغلاق مشغل الفيديو
        function closeWatchView() {
            document.getElementById('youtube-player').src = '';
            document.getElementById('watch-view').style.display = 'none';
        }

        // تشغيل الجلب التلقائي عند تشغيل الصفحة
        window.onload = () => {
            fetchTrendingVideos();
        };
    </script>
</body>
</html>
